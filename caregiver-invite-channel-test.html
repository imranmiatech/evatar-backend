<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caregiver Invite Channel Test</title>
    <style>
      :root {
        --ink: #0f2730;
        --muted: #60747c;
        --line: #d9e8eb;
        --brand: #075f68;
        --brand-2: #0aa5a7;
        --soft: #eef7f7;
        --danger: #d92525;
        --bg: #f4f7f8;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f5fbfb 0%, #edf2f4 100%);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(1160px, calc(100vw - 32px));
        margin: 32px auto;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 18px;
      }

      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 18px 45px rgba(15, 39, 48, 0.08);
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 16px;
        margin-bottom: 14px;
      }

      p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 14px 0 7px;
        color: #29464f;
        font-size: 13px;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #b9d7dc;
        border-radius: 8px;
        padding: 12px;
        color: var(--ink);
        background: #fbfefe;
        font: inherit;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--brand-2);
        box-shadow: 0 0 0 3px rgba(10, 165, 167, 0.14);
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 14px;
        color: #fff;
        background: var(--brand);
        font-weight: 800;
        cursor: pointer;
      }

      button.secondary {
        color: var(--brand);
        background: var(--soft);
      }

      button.ghost {
        color: var(--brand);
        background: #fff;
        border: 1px solid #b9d7dc;
      }

      button.danger {
        background: var(--danger);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .pill-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .pill {
        border: 1px solid #b9d7dc;
        background: #fff;
        color: var(--ink);
      }

      .pill.active {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }

      .hint {
        padding: 12px;
        border-radius: 8px;
        background: var(--soft);
        color: #29525a;
        font-size: 13px;
      }

      .hidden {
        display: none;
      }

      .result {
        min-height: 520px;
        overflow: auto;
        border-radius: 8px;
        background: #071e25;
        color: #d9f7f7;
        padding: 14px;
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--brand);
        font-size: 12px;
        font-weight: 800;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      @media (max-width: 880px) {
        main {
          grid-template-columns: 1fr;
          margin: 16px auto;
        }

        .header {
          align-items: flex-start;
          flex-direction: column;
        }

        .grid,
        .pill-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="header">
        <div>
          <h1>Caregiver Invite Channel Test</h1>
          <p>Login, then test email only, WhatsApp only, or email + WhatsApp invite delivery.</p>
        </div>
        <span class="status" id="authStatus">Not logged in</span>
      </section>

      <section>
        <h2>1. Login</h2>
        <label for="baseUrl">API Base URL</label>
        <input id="baseUrl" value="http://localhost:5000/api/v1" />

        <div class="grid">
          <div>
            <label for="email">Email</label>
            <input id="email" value="p@e.com" />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" value="123456" />
          </div>
        </div>

        <div class="actions">
          <button id="loginBtn">Login</button>
          <button class="secondary" id="meBtn">GET /auth/me</button>
          <button class="secondary" id="saveTokenBtn">Save token</button>
          <button class="ghost" id="clearBtn">Clear token</button>
        </div>

        <label for="tokenBox">Saved auth token</label>
        <textarea
          id="tokenBox"
          rows="3"
          placeholder="Login korle access token ekhane save hobe"
        ></textarea>

        <h2 style="margin-top: 24px">2. Invite</h2>
        <label for="childId">Child ID</label>
        <input id="childId" value="5576fad9-a948-4975-9341-18747e80a3bb" />

        <label>Role</label>
        <div class="pill-grid" id="roleGrid">
          <button class="pill active" data-role="NANNY">Nanny</button>
          <button class="pill" data-role="PARENT">Parent</button>
          <button class="pill" data-role="FAMILY_MEMBER">Family</button>
        </div>

        <div id="familyFields" class="hidden">
          <label for="invitedName">Family member name</label>
          <input id="invitedName" value="Martha Stewart" />

          <label for="relationship">Relationship</label>
          <select id="relationship">
            <option value="GRANDMOTHER">Grandmother</option>
            <option value="GUARDIAN">Guardian</option>
            <option value="GODPARENT">Godparent</option>
            <option value="GRANDFATHER">Grandfather</option>
            <option value="UNCLE">Uncle</option>
            <option value="SIBLING">Sibling</option>
            <option value="AUNT">Aunt</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <label>Send mode</label>
        <div class="pill-grid" id="channelGrid">
          <button class="pill active" data-channel="EMAIL">Email</button>
          <button class="pill" data-channel="WHATSAPP">WhatsApp</button>
          <button class="pill" data-channel="EMAIL_WHATSAPP">Both</button>
        </div>

        <div class="grid">
          <div>
            <label for="invitedEmail">Invite email</label>
            <input id="invitedEmail" value="test-family@example.com" />
          </div>
          <div>
            <label for="invitedPhone">Invite phone</label>
            <input id="invitedPhone" value="+15550000000" />
          </div>
        </div>

        <div class="hint" id="modeHint">Email mode requires invitedEmail.</div>

        <div class="actions">
          <button id="inviteBtn">Send invite</button>
          <button class="secondary" id="listBtn">GET caregivers</button>
        </div>
      </section>

      <section>
        <div class="row">
          <h2>Response</h2>
          <button class="ghost" id="copyBtn">Copy response</button>
        </div>
        <pre class="result" id="output">Ready.</pre>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const tokenStorageKey = "caregiverInviteToken";
      let token = localStorage.getItem(tokenStorageKey) || "";
      let role = "NANNY";
      let channel = "EMAIL";

      function baseUrl() {
        return $("baseUrl").value.replace(/\/$/, "");
      }

      function setOutput(value) {
        $("output").textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      function authHeaders(json = true) {
        token = $("tokenBox").value.trim() || token;
        const headers = {};
        if (json) headers["Content-Type"] = "application/json";
        if (token) headers.Authorization = `Bearer ${token}`;
        return headers;
      }

      function setAuthStatus() {
        $("tokenBox").value = token;
        $("authStatus").textContent = token
          ? `Token saved ...${token.slice(-10)}`
          : "Not logged in";
      }

      function saveToken(value) {
        token = value.trim();
        if (token) {
          localStorage.setItem(tokenStorageKey, token);
        } else {
          localStorage.removeItem(tokenStorageKey);
        }
        setAuthStatus();
      }

      async function request(path, options = {}) {
        const response = await fetch(`${baseUrl()}${path}`, options);
        const text = await response.text();
        let data;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }
        setOutput({ status: response.status, ok: response.ok, data });
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        return data;
      }

      function setActive(groupId, attr, value) {
        document.querySelectorAll(`#${groupId} .pill`).forEach((button) => {
          button.classList.toggle("active", button.dataset[attr] === value);
        });
      }

      function refreshConditionalUi() {
        $("familyFields").classList.toggle("hidden", role !== "FAMILY_MEMBER");

        const needsEmail = channel === "EMAIL" || channel === "EMAIL_WHATSAPP";
        const needsPhone = channel === "WHATSAPP" || channel === "EMAIL_WHATSAPP";
        $("invitedEmail").disabled = !needsEmail;
        $("invitedPhone").disabled = !needsPhone;

        $("modeHint").textContent =
          channel === "EMAIL"
            ? "Email mode requires invitedEmail."
            : channel === "WHATSAPP"
              ? "WhatsApp mode requires invitedPhone."
              : "Both mode requires invitedEmail and invitedPhone.";
      }

      function invitePayload() {
        const payload = {
          role,
          inviteChannel: channel,
        };

        if (channel === "EMAIL" || channel === "EMAIL_WHATSAPP") {
          payload.invitedEmail = $("invitedEmail").value.trim();
        }

        if (channel === "WHATSAPP" || channel === "EMAIL_WHATSAPP") {
          payload.invitedPhone = $("invitedPhone").value.trim();
        }

        if (role === "FAMILY_MEMBER") {
          payload.invitedName = $("invitedName").value.trim();
          payload.relationship = $("relationship").value;
        }

        return payload;
      }

      $("loginBtn").onclick = async () => {
        const data = await request("/auth/signin", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            email: $("email").value.trim(),
            password: $("password").value,
          }),
        });
        saveToken(data.accessToken || data.data?.accessToken || "");
        setOutput({
          message: "Login successful. Auth token saved.",
          user: data.user || data.data?.user,
          accessTokenPreview: token ? `${token.slice(0, 18)}...${token.slice(-10)}` : null,
        });
      };

      $("saveTokenBtn").onclick = () => {
        saveToken($("tokenBox").value);
        setOutput("Token saved to localStorage and will be used as Bearer auth.");
      };

      $("meBtn").onclick = () =>
        request("/auth/me", {
          headers: authHeaders(false),
        });

      $("clearBtn").onclick = () => {
        saveToken("");
        setOutput("Token cleared.");
      };

      $("inviteBtn").onclick = () =>
        request(`/caregivers/children/${$("childId").value.trim()}/invitations`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify(invitePayload()),
        });

      $("listBtn").onclick = () =>
        request(`/caregivers/children/${$("childId").value.trim()}`, {
          headers: authHeaders(false),
        });

      $("copyBtn").onclick = async () => {
        await navigator.clipboard.writeText($("output").textContent);
      };

      document.querySelectorAll("#roleGrid .pill").forEach((button) => {
        button.onclick = () => {
          role = button.dataset.role;
          setActive("roleGrid", "role", role);
          refreshConditionalUi();
        };
      });

      document.querySelectorAll("#channelGrid .pill").forEach((button) => {
        button.onclick = () => {
          channel = button.dataset.channel;
          setActive("channelGrid", "channel", channel);
          refreshConditionalUi();
        };
      });

      setAuthStatus();
      refreshConditionalUi();
    </script>
  </body>
</html>
