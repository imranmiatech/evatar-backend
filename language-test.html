<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #eef3f4;
        color: #102a30;
      }

      .page {
        max-width: 860px;
        margin: 0 auto;
        padding: 24px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d7e1e3;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 16px;
      }

      h1,
      h2 {
        margin: 0 0 12px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 17px;
      }

      label {
        display: block;
        margin: 10px 0 6px;
        color: #526a70;
        font-size: 13px;
      }

      input,
      select,
      textarea,
      button {
        width: 100%;
        border-radius: 8px;
        font: inherit;
      }

      input,
      select,
      textarea {
        border: 1px solid #c8d7da;
        padding: 11px 12px;
        background: #fbfdfd;
        color: #102a30;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        border: 0;
        padding: 11px 14px;
        background: #075c66;
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: #e8eff0;
        color: #14353b;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .languages {
        display: grid;
        gap: 10px;
      }

      .language-card {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        border: 1px solid #d7e1e3;
        background: #f9fbfb;
        color: #102a30;
        text-align: left;
      }

      .language-card.active {
        border-color: #075c66;
        background: #e8f5f6;
      }

      .tiny {
        color: #6b8186;
        font-size: 12px;
        margin-top: 2px;
      }

      .status {
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef8f9;
        color: #075c66;
        font-size: 13px;
        word-break: break-word;
      }

      .status.error {
        background: #fff0f0;
        color: #9d1d1d;
      }

      pre {
        margin: 0;
        padding: 12px;
        border-radius: 8px;
        background: #102a30;
        color: #e7fbff;
        overflow: auto;
        white-space: pre-wrap;
      }

      @media (max-width: 640px) {
        .page {
          padding: 14px;
        }

        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Language Backend Test</h1>
        <label for="baseUrl">API Base URL</label>
        <input id="baseUrl" value="http://localhost:5000/api/v1" />

        <div class="row">
          <div>
            <label for="email">Email</label>
            <input id="email" value="p@e.com" />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" value="123456" />
          </div>
        </div>

        <div class="row" style="margin-top: 12px">
          <button id="loginBtn">Login</button>
          <button id="loadProfileBtn" class="secondary">Load Profile</button>
        </div>
        <div id="status" class="status" style="margin-top: 12px">
          Not logged in
        </div>
      </section>

      <section class="panel">
        <h2>Choose Language</h2>
        <div id="languages" class="languages"></div>
        <button id="saveLanguageBtn" style="margin-top: 12px">
          Save Selected Language
        </button>
      </section>

      <section class="panel">
        <h2>Auto Translated API Response</h2>
        <div class="row">
          <button id="loadSupportBtn">Load Support Tickets</button>
          <button id="loadProfileTranslatedBtn" class="secondary">
            Load Profile With Header
          </button>
        </div>
        <label for="manualJson">Manual holder test JSON</label>
        <textarea id="manualJson">{
  "status": "PENDING",
  "role": "PARENT",
  "message": "Support chat is not open yet",
  "name": "Parent User"
}</textarea>
        <button id="translateBtn">Translate Manual JSON</button>
      </section>

      <section class="panel">
        <h2>Output</h2>
        <pre id="output">No output yet.</pre>
      </section>
    </main>

    <script>
      const state = {
        token: localStorage.getItem('languageTestToken') || '',
        selectedLanguage: localStorage.getItem('languageTestLanguage') || 'en',
      };

      const el = {
        baseUrl: document.getElementById('baseUrl'),
        email: document.getElementById('email'),
        password: document.getElementById('password'),
        loginBtn: document.getElementById('loginBtn'),
        loadProfileBtn: document.getElementById('loadProfileBtn'),
        loadSupportBtn: document.getElementById('loadSupportBtn'),
        loadProfileTranslatedBtn: document.getElementById(
          'loadProfileTranslatedBtn',
        ),
        saveLanguageBtn: document.getElementById('saveLanguageBtn'),
        translateBtn: document.getElementById('translateBtn'),
        languages: document.getElementById('languages'),
        manualJson: document.getElementById('manualJson'),
        status: document.getElementById('status'),
        output: document.getElementById('output'),
      };

      function apiPath(path) {
        return `${el.baseUrl.value.replace(/\/$/, '')}${path}`;
      }

      async function api(path, options = {}) {
        const headers = {
          ...(options.body instanceof FormData
            ? {}
            : { 'Content-Type': 'application/json' }),
          ...(options.headers || {}),
        };

        if (state.token) {
          headers.Authorization = `Bearer ${state.token}`;
        }

        if (state.selectedLanguage) {
          headers['x-language'] = state.selectedLanguage;
        }

        const response = await fetch(apiPath(path), {
          ...options,
          headers,
          credentials: 'include',
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || `HTTP ${response.status}`);
        }

        return payload;
      }

      function setStatus(message, isError = false) {
        el.status.textContent = message;
        el.status.classList.toggle('error', isError);
      }

      function showOutput(value) {
        el.output.textContent = JSON.stringify(value, null, 2);
      }

      function renderLanguages(languages) {
        el.languages.innerHTML = '';
        languages.forEach((language) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className =
            'language-card' +
            (language.code === state.selectedLanguage ? ' active' : '');
          button.innerHTML = `
            <span>
              <strong>${language.label}</strong>
              <div class="tiny">${language.nativeName}</div>
            </span>
            <span>${language.code === state.selectedLanguage ? 'Selected' : ''}</span>
          `;
          button.addEventListener('click', () => {
            state.selectedLanguage = language.code;
            localStorage.setItem('languageTestLanguage', language.code);
            renderLanguages(languages);
          });
          el.languages.append(button);
        });
      }

      async function loadLanguages() {
        const response = await api('/language');
        renderLanguages(response.data);
      }

      async function login() {
        const response = await api('/auth/signin', {
          method: 'POST',
          body: JSON.stringify({
            email: el.email.value.trim(),
            password: el.password.value,
          }),
        });

        state.token = response.data.accessToken;
        localStorage.setItem('languageTestToken', state.token);
        setStatus(`Logged in as ${response.data.user.email}`);
        showOutput(response);
      }

      async function saveLanguage() {
        const response = await api('/language/preferred', {
          method: 'PATCH',
          body: JSON.stringify({ language: state.selectedLanguage }),
        });
        setStatus(`Saved language: ${state.selectedLanguage}`);
        showOutput(response);
      }

      async function loadProfile() {
        const response = await api('/user/me');
        showOutput(response);
      }

      async function loadSupportTickets() {
        const response = await api('/support/tickets');
        showOutput(response);
      }

      async function translateManual() {
        const data = JSON.parse(el.manualJson.value);
        const response = await api('/language/translate', {
          method: 'POST',
          body: JSON.stringify({
            language: state.selectedLanguage,
            data,
          }),
        });
        showOutput(response);
      }

      function showError(error) {
        console.error(error);
        setStatus(error.message || 'Something went wrong', true);
      }

      el.loginBtn.addEventListener('click', () => login().catch(showError));
      el.loadProfileBtn.addEventListener('click', () =>
        loadProfile().catch(showError),
      );
      el.loadProfileTranslatedBtn.addEventListener('click', () =>
        loadProfile().catch(showError),
      );
      el.loadSupportBtn.addEventListener('click', () =>
        loadSupportTickets().catch(showError),
      );
      el.saveLanguageBtn.addEventListener('click', () =>
        saveLanguage().catch(showError),
      );
      el.translateBtn.addEventListener('click', () =>
        translateManual().catch(showError),
      );

      loadLanguages().catch(showError);
      if (state.token) {
        setStatus('Token loaded. Pick a language and test an endpoint.');
      }
    </script>
  </body>
</html>
