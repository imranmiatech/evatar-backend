<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Evatar Support Full Flow Test</title>
  <script src="./node_modules/socket.io/client-dist/socket.io.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1, h2, h3 { color: #1a5c68; }
    input, textarea, button, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #1a5c68; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #124049; }
    
    /* Layouts */
    .section { border: 1px solid #e1e4e8; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #fafbfc; }
    .hidden { display: none; }
    
    /* Tickets List */
    .ticket-card { background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .ticket-card:hover { border-color: #1a5c68; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge.PENDING { background: #fff3cd; color: #856404; }
    .badge.REPLIED { background: #d4edda; color: #155724; }
    .badge.RESOLVED { background: #e2e3e5; color: #383d41; }
    
    /* Chat Box */
    #chat-box { height: 350px; overflow-y: auto; background: #ece5dd; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; }
    .msg { max-width: 70%; padding: 10px 14px; margin-bottom: 10px; border-radius: 8px; position: relative; clear: both; }
    .msg.me { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
    .msg.other { background: white; align-self: flex-start; border-bottom-left-radius: 0; }
    .msg-sender { font-size: 11px; font-weight: bold; color: #666; margin-bottom: 4px; }
    .voice-controls { display: none; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 10px; border: 1px solid #f0b4ae; border-radius: 6px; background: #fff8f7; }
    .voice-controls.visible { display: flex; }
    .record-dot { width: 9px; height: 9px; border-radius: 999px; background: #dc3545; animation: pulse 1s infinite; }
    .record-btn { width: 90px; background: #6c757d; }
    .stop-btn { width: 90px; background: #dc3545; }
    .cancel-btn { width: 90px; background: #6c757d; }
    .voice-preview { display: none; align-items: center; gap: 8px; margin-bottom: 8px; padding: 8px 10px; border: 1px solid #c8d7da; border-radius: 6px; background: #f7fbfb; font-size: 13px; }
    .voice-preview.visible { display: flex; }
    .voice-preview button { width: 90px; background: #6c757d; }
    .attachment-audio { display: block; width: min(360px, 100%); margin-top: 5px; }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    
    .resolved-btn { background: #6c757d; }
    .resolved-btn:hover { background: #5a6268; }
    
    #userInfo { margin-bottom: 20px; font-weight: bold; color: #1a5c68; display: flex; justify-content: space-between; align-items: center;}
  </style>
</head>
<body>

<div class="container">
  <h1>Evatar Support Flow Test</h1>
  
  <!-- 1. Authentication (Login) -->
  <div class="section" id="authSection">
    <h2>1. Login</h2>
    <p>Please login with an existing User or Admin account.</p>
    <form onsubmit="event.preventDefault(); login();">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
  </div>

  <div id="mainContent" class="hidden">
    
    <div id="userInfo">
      <span id="welcomeMsg"></span>
      <button onclick="logout()" style="width: auto; background: #dc3545; padding: 5px 10px;">Logout</button>
    </div>

    <!-- USER SECTION -->
    <div id="userSection" class="hidden">
      <div class="section">
        <h2>Submit Ticket (User)</h2>
        <input type="text" id="subject" placeholder="Subject (e.g., Payment Issue)">
        <textarea id="message" rows="3" placeholder="Describe your issue..."></textarea>
        <button onclick="submitTicket()">Submit Ticket</button>
      </div>

      <div class="section">
        <h2>My Tickets (User)</h2>
        <button onclick="fetchMyTickets()">Refresh Tickets</button>
        <div id="userTicketsList" style="margin-top: 15px;"></div>
      </div>
    </div>

    <!-- ADMIN SECTION -->
    <div id="adminSection" class="hidden">
      <div class="section">
        <h2>All Tickets (Admin)</h2>
        <button onclick="fetchAllTickets()">Refresh All Tickets</button>
        <div id="adminTicketsList" style="margin-top: 15px;"></div>
      </div>
    </div>

  </div>

  <!-- Chat Interface (Used by both User and Admin) -->
  <div class="section hidden" id="chatSection">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 id="chatTitle">Support Team Chat</h2>
      <button onclick="closeChat()" style="width: auto; background: #dc3545;">Close Chat</button>
    </div>
    
    <p id="socketStatus" style="color: #666; font-size: 12px;">Socket Status: Disconnected</p>
    <p id="chatStatus" style="color: #666; font-size: 12px;"></p>
    
    <div id="chat-box"></div>

    <div id="voiceControls" class="voice-controls">
      <span class="record-dot"></span>
      <strong id="recordingTime">00:00</strong>
      <span>Recording voice...</span>
      <button type="button" class="stop-btn" onclick="stopRecording()">Stop</button>
      <button type="button" class="cancel-btn" onclick="cancelRecording()">Cancel</button>
    </div>

    <div id="voicePreview" class="voice-preview">
      <strong>Voice ready</strong>
      <span id="voiceFileName"></span>
      <button type="button" onclick="clearRecordedVoice()">Remove</button>
    </div>
    
    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="file" id="chatAttachment" style="width: 250px;" accept="image/*,audio/*,.pdf,.doc,.docx">
      <input type="text" id="chatInput" placeholder="Write your message...">
      <button type="button" class="record-btn" onclick="startRecording()">Mic</button>
      <button type="button" onclick="sendChatMessage()" style="width: 150px;">Send</button>
    </div>
    
    <!-- User Action -->
    <button class="resolved-btn hidden" id="userResolveBtn" onclick="userMarkAsResolved()" style="margin-top: 15px;">Issue Resolved</button>
    
    <!-- Admin Actions -->
    <div id="adminActions" class="hidden" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
      <h4>Admin Status Update</h4>
      <div style="display: flex; gap: 10px;">
        <select id="adminStatusSelect">
          <option value="PENDING">PENDING</option>
          <option value="REPLIED">REPLIED</option>
          <option value="RESOLVED">RESOLVED</option>
        </select>
        <button onclick="adminUpdateStatus()">Update Status</button>
      </div>
    </div>
  </div>

</div>

<script>
  let JWT_TOKEN = '';
  let USER_ID = '';
  let USER_ROLE = '';
  let CURRENT_TICKET_ID = '';
  let CURRENT_TICKET_STATUS = '';
  let socket = null;
  let recorder = null;
  let recordStream = null;
  let recordChunks = [];
  let recordStartedAt = 0;
  let recordTimer = null;
  let recordedVoiceFile = null;
  const BASE_URL = 'http://localhost:5000/api/v1';

  async function login() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    try {
      const res = await fetch(`${BASE_URL}/auth/signin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      
      if (!res.ok) throw new Error(data.message || 'Login failed');
      
      // The backend interceptor wraps the response in a `data` object
      const authData = data.data || data; 
      
      JWT_TOKEN = authData.accessToken; 
      USER_ID = authData.user.id;
      USER_ROLE = authData.user.role;
      
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      document.getElementById('welcomeMsg').innerText = `Logged in as: ${authData.user.fullName || authData.user.email} (${USER_ROLE})`;
      
      if (USER_ROLE === 'ADMIN') {
        document.getElementById('adminSection').classList.remove('hidden');
        fetchAllTickets();
      } else {
        document.getElementById('userSection').classList.remove('hidden');
        fetchMyTickets();
      }
    } catch (e) {
      alert(e.message);
    }
  }

  function logout() {
    JWT_TOKEN = '';
    USER_ID = '';
    USER_ROLE = '';
    document.getElementById('authSection').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
    document.getElementById('userSection').classList.add('hidden');
    document.getElementById('adminSection').classList.add('hidden');
    document.getElementById('chatSection').classList.add('hidden');
    if (socket) socket.disconnect();
  }

  async function authFetch(url, options = {}) {
    if (!options.headers) options.headers = {};
    options.headers['Authorization'] = `Bearer ${JWT_TOKEN}`;
    options.headers['Content-Type'] = 'application/json';
    
    const res = await fetch(url, options);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  // --- USER METHODS ---

  async function submitTicket() {
    const subject = document.getElementById('subject').value;
    const message = document.getElementById('message').value;
    
    try {
      await authFetch(`${BASE_URL}/support/ticket`, {
        method: 'POST',
        body: JSON.stringify({ subject, message })
      });
      alert('Ticket submitted successfully!');
      document.getElementById('subject').value = '';
      document.getElementById('message').value = '';
      fetchMyTickets();
    } catch (e) {
      alert(e.message);
    }
  }

  async function fetchMyTickets() {
    try {
      const response = await authFetch(`${BASE_URL}/support/tickets`);
      renderTicketsList(response.data, 'userTicketsList');
    } catch (e) { alert(e.message); }
  }

  async function userMarkAsResolved() {
    if(!confirm("Are you sure you want to mark this issue as resolved?")) return;
    try {
      await authFetch(`${BASE_URL}/support/tickets/${CURRENT_TICKET_ID}/resolve`, { method: 'PATCH' });
      alert('Issue marked as resolved!');
      document.getElementById('userResolveBtn').classList.add('hidden');
    } catch (e) { alert(e.message); }
  }


  // --- ADMIN METHODS ---

  async function fetchAllTickets() {
    try {
      const response = await authFetch(`${BASE_URL}/support/admin/tickets`);
      renderTicketsList(response.data, 'adminTicketsList', true);
    } catch (e) { alert(e.message); }
  }

  async function adminUpdateStatus() {
    const status = document.getElementById('adminStatusSelect').value;
    try {
      await authFetch(`${BASE_URL}/support/admin/tickets/${CURRENT_TICKET_ID}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      CURRENT_TICKET_STATUS = status;
      updateComposerState();
      alert('Status updated successfully!');
    } catch(e) { alert(e.message); }
  }


  // --- SHARED UI LOGIC ---

  function renderTicketsList(tickets, containerId, isAdmin = false) {
    const list = document.getElementById(containerId);
    list.innerHTML = '';
    
    tickets.forEach(ticket => {
      const card = document.createElement('div');
      card.className = 'ticket-card';
      card.onclick = () => openChat(ticket.id, ticket.subject, ticket.status);
      
      const extraInfo = isAdmin && ticket.user ? `<div style="font-size:12px; color:#1a5c68">By: ${ticket.user.email}</div>` : '';

      card.innerHTML = `
        <div>
          <div style="font-weight: bold; font-size: 16px;">${ticket.subject}</div>
          ${extraInfo}
          <div style="font-size: 12px; color: #888; margin-top: 5px;">${new Date(ticket.createdAt).toLocaleString()}</div>
        </div>
        <span class="badge ${ticket.status}">${ticket.status}</span>
      `;
      list.appendChild(card);
    });
  }

  async function openChat(ticketId, subject, status) {
    CURRENT_TICKET_ID = ticketId;
    CURRENT_TICKET_STATUS = status;
    clearRecordedVoice(true);
    setChatStatus('');
    document.getElementById('mainContent').classList.add('hidden');
    document.getElementById('chatSection').classList.remove('hidden');
    document.getElementById('chatTitle').innerText = `Chat: ${subject}`;
    
    // Configure Buttons
    const resolveBtn = document.getElementById('userResolveBtn');
    const adminActions = document.getElementById('adminActions');
    
    if (USER_ROLE === 'ADMIN') {
      resolveBtn.classList.add('hidden');
      adminActions.classList.remove('hidden');
      document.getElementById('adminStatusSelect').value = status;
    } else {
      adminActions.classList.add('hidden');
      if (status !== 'RESOLVED') resolveBtn.classList.remove('hidden');
      else resolveBtn.classList.add('hidden');
    }
    
    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML = 'Loading history...';

    // 1. Fetch History via REST
    try {
      const response = await authFetch(`${BASE_URL}/support/tickets/${ticketId}/messages`);
      chatBox.innerHTML = ''; 
      CURRENT_TICKET_STATUS = response.data.ticket.status;
      
      appendMessage('Ticket Subject', response.data.ticket.subject, 'other');

      response.data.messages.forEach(msg => {
        const isMe = msg.senderId === USER_ID;
        appendMessage(isMe ? 'You' : msg.sender?.fullName || 'Other', msg.message, isMe ? 'me' : 'other', msg.attachmentUrl, msg.attachmentType);
      });

    } catch (e) {
      chatBox.innerHTML = `<span style="color:red">Failed to load history: ${e.message}</span>`;
      return;
    }

    // 2. Connect Socket.io
    initSocket();
    updateComposerState();
  }

  function appendMessage(senderName, text, type, attachmentUrl = null, attachmentType = null) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    
    let contentHtml = text ? `<div>${text}</div>` : '';
    
    if (attachmentUrl) {
      if (attachmentType && attachmentType.startsWith('image')) {
        contentHtml += `<div style="margin-top: 5px;"><img src="${attachmentUrl}" style="max-width: 100%; border-radius: 4px;" alt="Attachment"></div>`;
      } else if (attachmentType && attachmentType.startsWith('audio')) {
        contentHtml += `<audio class="attachment-audio" controls src="${attachmentUrl}"></audio>`;
      } else {
        contentHtml += `<div style="margin-top: 5px;"><a href="${attachmentUrl}" target="_blank" style="color: #1a5c68; text-decoration: underline;">📎 View Attachment</a></div>`;
      }
    }

    div.innerHTML = `<div class="msg-sender">${senderName}</div>${contentHtml}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function initSocket() {
    if (socket) socket.disconnect();
    
    if (!window.io) {
      document.getElementById('socketStatus').innerText =
        'Socket Status: socket.io client not loaded; REST send still works';
      return;
    }

    socket = io('http://localhost:5000/support');
    
    socket.on('connect', () => {
      document.getElementById('socketStatus').innerText = 'Socket Status: Connected';
      socket.emit('joinTicket', { ticketId: CURRENT_TICKET_ID, userId: USER_ID }, (res) => {
        if (res.event === 'error') alert('Socket join error: ' + res.data.message);
      });
    });

    socket.on('receiveMessage', (data) => {
      if (data.senderId !== USER_ID) {
        appendMessage(data.sender?.fullName || 'Other', data.message, 'other', data.attachmentUrl, data.attachmentType);
      }
    });

    socket.on('disconnect', () => {
      document.getElementById('socketStatus').innerText = 'Socket Status: Disconnected';
    });
  }

  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const fileInput = document.getElementById('chatAttachment');
    const message = input.value.trim();
    const file = fileInput.files[0] || recordedVoiceFile;

    if (!message && !file) return;

    if (!canSendSupportMessage()) {
      setChatStatus(supportStatusMessage(), true);
      alert(supportStatusMessage());
      return;
    }

    try {
      setChatStatus(file ? 'Uploading and sending...' : 'Sending...');
      const formData = new FormData();
      if (message) formData.append('message', message);
      if (file) formData.append('file', file);

      const res = await fetch(`${BASE_URL}/support/tickets/${CURRENT_TICKET_ID}/messages`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${JWT_TOKEN}` },
        body: formData
      });

      const data = await res.json();
      if (res.status === 401) {
        throw new Error('Session expired. Please logout, login again, then send the file/voice.');
      }
      if (!res.ok) throw new Error(data.message || 'Message send failed');

      const sentMessage = data.data || data;
      appendMessage(
        'You',
        sentMessage.message,
        'me',
        sentMessage.attachmentUrl,
        sentMessage.attachmentType,
      );
      input.value = '';
      fileInput.value = '';
      clearRecordedVoice();
      setChatStatus('Sent');
    } catch (e) {
      setChatStatus(e.message, true);
      alert(e.message);
    }
  }

  function setChatStatus(message, isError = false) {
    const status = document.getElementById('chatStatus');
    status.textContent = message;
    status.style.color = isError ? '#dc3545' : '#666';
  }

  function supportedAudioMimeType() {
    const types = [
      'audio/webm',
      'audio/mp4',
      'audio/webm;codecs=opus',
      'audio/ogg;codecs=opus',
    ];

    return types.find((type) => MediaRecorder.isTypeSupported(type)) || '';
  }

  function normalizeAudioMimeType(mimeType) {
    const [baseType] = String(mimeType || '').split(';');
    return baseType || 'audio/webm';
  }

  async function startRecording() {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      alert('Voice recording is not supported in this browser');
      return;
    }

    if (!CURRENT_TICKET_ID) {
      alert('Open a ticket first');
      return;
    }

    if (!canSendSupportMessage()) {
      setChatStatus(supportStatusMessage(), true);
      alert(supportStatusMessage());
      return;
    }

    document.getElementById('chatAttachment').value = '';
    clearRecordedVoice();
    try {
      recordChunks = [];
      recordStream = await navigator.mediaDevices.getUserMedia({ audio: true });

      const mimeType = supportedAudioMimeType();
      recorder = new MediaRecorder(recordStream, mimeType ? { mimeType } : undefined);

      recorder.addEventListener('dataavailable', (event) => {
        if (event.data.size > 0) recordChunks.push(event.data);
      });

      recorder.addEventListener('stop', () => {
        stopRecordTimer();
        stopRecordStream();
        setRecordingUi(false);
      });

      recordStartedAt = Date.now();
      recorder.start();
      setRecordingUi(true);
      startRecordTimer();
    } catch (error) {
      stopRecordStream();
      alert(error.message || 'Could not start recording');
    }
  }

  function stopRecording() {
    if (!recorder || recorder.state === 'inactive') return;

    recorder.addEventListener(
      'stop',
      () => {
        const mimeType = normalizeAudioMimeType(
          recorder.mimeType || recordChunks[0]?.type || 'audio/webm',
        );
        const extension = mimeType.includes('mp4') ? 'm4a' : 'webm';
        const blob = new Blob(recordChunks, { type: mimeType });
        const file = new File([blob], `support-voice-${Date.now()}.${extension}`, {
          type: mimeType,
        });
        setRecordedVoice(file);
        recordChunks = [];
      },
      { once: true },
    );

    recorder.stop();
  }

  function cancelRecording() {
    if (recorder && recorder.state !== 'inactive') {
      recordChunks = [];
      recorder.stop();
    } else {
      stopRecordTimer();
      stopRecordStream();
      setRecordingUi(false);
    }
  }

  function setRecordedVoice(file) {
    recordedVoiceFile = file;
    const transfer = new DataTransfer();
    transfer.items.add(file);
    document.getElementById('chatAttachment').files = transfer.files;
    document.getElementById('voiceFileName').textContent = `${file.name} (${Math.max(1, Math.round(file.size / 1024))} KB)`;
    document.getElementById('voicePreview').classList.add('visible');
  }

  function clearRecordedVoice(clearFileInput = false) {
    recordedVoiceFile = null;
    if (clearFileInput) {
      document.getElementById('chatAttachment').value = '';
    }
    document.getElementById('voiceFileName').textContent = '';
    document.getElementById('voicePreview').classList.remove('visible');
  }

  function setRecordingUi(isRecording) {
    document.getElementById('voiceControls').classList.toggle('visible', isRecording);
  }

  function canSendSupportMessage() {
    return CURRENT_TICKET_STATUS === 'REPLIED';
  }

  function supportStatusMessage() {
    if (CURRENT_TICKET_STATUS === 'RESOLVED') {
      return 'Ticket is resolved. You cannot send messages.';
    }
    if (CURRENT_TICKET_STATUS === 'PENDING') {
      return 'Ticket is pending. Set status to REPLIED before sending messages.';
    }
    return 'Support chat is not open yet.';
  }

  function updateComposerState() {
    const disabled = !canSendSupportMessage();
    document.getElementById('chatInput').disabled = disabled;
    document.getElementById('chatAttachment').disabled = disabled;
    document.querySelector('.record-btn').disabled = disabled;
    document.querySelector('button[onclick="sendChatMessage()"]').disabled = disabled;
    setChatStatus(disabled ? supportStatusMessage() : '');
  }

  function startRecordTimer() {
    stopRecordTimer();
    updateRecordTimer();
    recordTimer = window.setInterval(updateRecordTimer, 500);
  }

  function stopRecordTimer() {
    if (recordTimer) {
      window.clearInterval(recordTimer);
      recordTimer = null;
    }
  }

  function updateRecordTimer() {
    const seconds = Math.floor((Date.now() - recordStartedAt) / 1000);
    const minutes = Math.floor(seconds / 60);
    const rest = seconds % 60;
    document.getElementById('recordingTime').textContent = `${String(minutes).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;
  }

  function stopRecordStream() {
    recordStream?.getTracks().forEach((track) => track.stop());
    recordStream = null;
  }

  document.getElementById('chatAttachment').addEventListener('change', () => {
    if (document.getElementById('chatAttachment').files[0]) {
      clearRecordedVoice();
    }
  });

  function closeChat() {
    if(socket) { socket.disconnect(); socket = null; }
    document.getElementById('chatSection').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    if(USER_ROLE === 'ADMIN') fetchAllTickets();
    else fetchMyTickets();
  }
</script>

</body>
</html>
