<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Evatar Support Full Flow Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1, h2, h3 { color: #1a5c68; }
    input, textarea, button, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #1a5c68; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #124049; }
    
    /* Layouts */
    .section { border: 1px solid #e1e4e8; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #fafbfc; }
    .hidden { display: none; }
    
    /* Tickets List */
    .ticket-card { background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .ticket-card:hover { border-color: #1a5c68; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge.PENDING { background: #fff3cd; color: #856404; }
    .badge.REPLIED { background: #d4edda; color: #155724; }
    .badge.RESOLVED { background: #e2e3e5; color: #383d41; }
    
    /* Chat Box */
    #chat-box { height: 350px; overflow-y: auto; background: #ece5dd; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; }
    .msg { max-width: 70%; padding: 10px 14px; margin-bottom: 10px; border-radius: 8px; position: relative; clear: both; }
    .msg.me { background: #dcf8c6; align-self: flex-end; border-bottom-right-radius: 0; }
    .msg.other { background: white; align-self: flex-start; border-bottom-left-radius: 0; }
    .msg-sender { font-size: 11px; font-weight: bold; color: #666; margin-bottom: 4px; }
    
    .resolved-btn { background: #6c757d; }
    .resolved-btn:hover { background: #5a6268; }
    
    #userInfo { margin-bottom: 20px; font-weight: bold; color: #1a5c68; display: flex; justify-content: space-between; align-items: center;}
  </style>
</head>
<body>

<div class="container">
  <h1>Evatar Support Flow Test</h1>
  
  <!-- 1. Authentication (Login) -->
  <div class="section" id="authSection">
    <h2>1. Login</h2>
    <p>Please login with an existing User or Admin account.</p>
    <form onsubmit="event.preventDefault(); login();">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
  </div>

  <div id="mainContent" class="hidden">
    
    <div id="userInfo">
      <span id="welcomeMsg"></span>
      <button onclick="logout()" style="width: auto; background: #dc3545; padding: 5px 10px;">Logout</button>
    </div>

    <!-- USER SECTION -->
    <div id="userSection" class="hidden">
      <div class="section">
        <h2>Submit Ticket (User)</h2>
        <input type="text" id="subject" placeholder="Subject (e.g., Payment Issue)">
        <textarea id="message" rows="3" placeholder="Describe your issue..."></textarea>
        <button onclick="submitTicket()">Submit Ticket</button>
      </div>

      <div class="section">
        <h2>My Tickets (User)</h2>
        <button onclick="fetchMyTickets()">Refresh Tickets</button>
        <div id="userTicketsList" style="margin-top: 15px;"></div>
      </div>
    </div>

    <!-- ADMIN SECTION -->
    <div id="adminSection" class="hidden">
      <div class="section">
        <h2>All Tickets (Admin)</h2>
        <button onclick="fetchAllTickets()">Refresh All Tickets</button>
        <div id="adminTicketsList" style="margin-top: 15px;"></div>
      </div>
    </div>

  </div>

  <!-- Chat Interface (Used by both User and Admin) -->
  <div class="section hidden" id="chatSection">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 id="chatTitle">Support Team Chat</h2>
      <button onclick="closeChat()" style="width: auto; background: #dc3545;">Close Chat</button>
    </div>
    
    <p id="socketStatus" style="color: #666; font-size: 12px;">Socket Status: Disconnected</p>
    
    <div id="chat-box"></div>
    
    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="file" id="chatAttachment" style="width: 250px;" accept="image/*,.pdf,.doc,.docx">
      <input type="text" id="chatInput" placeholder="Write your message...">
      <button onclick="sendChatMessage()" style="width: 150px;">Send</button>
    </div>
    
    <!-- User Action -->
    <button class="resolved-btn hidden" id="userResolveBtn" onclick="userMarkAsResolved()" style="margin-top: 15px;">Issue Resolved</button>
    
    <!-- Admin Actions -->
    <div id="adminActions" class="hidden" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
      <h4>Admin Status Update</h4>
      <div style="display: flex; gap: 10px;">
        <select id="adminStatusSelect">
          <option value="PENDING">PENDING</option>
          <option value="REPLIED">REPLIED</option>
          <option value="RESOLVED">RESOLVED</option>
        </select>
        <button onclick="adminUpdateStatus()">Update Status</button>
      </div>
    </div>
  </div>

</div>

<script>
  let JWT_TOKEN = '';
  let USER_ID = '';
  let USER_ROLE = '';
  let CURRENT_TICKET_ID = '';
  let socket = null;
  const BASE_URL = 'http://localhost:5000/api/v1';

  async function login() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    try {
      const res = await fetch(`${BASE_URL}/auth/signin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      
      if (!res.ok) throw new Error(data.message || 'Login failed');
      
      // The backend interceptor wraps the response in a `data` object
      const authData = data.data || data; 
      
      JWT_TOKEN = authData.accessToken; 
      USER_ID = authData.user.id;
      USER_ROLE = authData.user.role;
      
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('mainContent').classList.remove('hidden');
      document.getElementById('welcomeMsg').innerText = `Logged in as: ${authData.user.fullName || authData.user.email} (${USER_ROLE})`;
      
      if (USER_ROLE === 'ADMIN') {
        document.getElementById('adminSection').classList.remove('hidden');
        fetchAllTickets();
      } else {
        document.getElementById('userSection').classList.remove('hidden');
        fetchMyTickets();
      }
    } catch (e) {
      alert(e.message);
    }
  }

  function logout() {
    JWT_TOKEN = '';
    USER_ID = '';
    USER_ROLE = '';
    document.getElementById('authSection').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
    document.getElementById('userSection').classList.add('hidden');
    document.getElementById('adminSection').classList.add('hidden');
    document.getElementById('chatSection').classList.add('hidden');
    if (socket) socket.disconnect();
  }

  async function authFetch(url, options = {}) {
    if (!options.headers) options.headers = {};
    options.headers['Authorization'] = `Bearer ${JWT_TOKEN}`;
    options.headers['Content-Type'] = 'application/json';
    
    const res = await fetch(url, options);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Request failed');
    return data;
  }

  // --- USER METHODS ---

  async function submitTicket() {
    const subject = document.getElementById('subject').value;
    const message = document.getElementById('message').value;
    
    try {
      await authFetch(`${BASE_URL}/support/ticket`, {
        method: 'POST',
        body: JSON.stringify({ subject, message })
      });
      alert('Ticket submitted successfully!');
      document.getElementById('subject').value = '';
      document.getElementById('message').value = '';
      fetchMyTickets();
    } catch (e) {
      alert(e.message);
    }
  }

  async function fetchMyTickets() {
    try {
      const response = await authFetch(`${BASE_URL}/support/tickets`);
      renderTicketsList(response.data, 'userTicketsList');
    } catch (e) { alert(e.message); }
  }

  async function userMarkAsResolved() {
    if(!confirm("Are you sure you want to mark this issue as resolved?")) return;
    try {
      await authFetch(`${BASE_URL}/support/tickets/${CURRENT_TICKET_ID}/resolve`, { method: 'PATCH' });
      alert('Issue marked as resolved!');
      document.getElementById('userResolveBtn').classList.add('hidden');
    } catch (e) { alert(e.message); }
  }


  // --- ADMIN METHODS ---

  async function fetchAllTickets() {
    try {
      const response = await authFetch(`${BASE_URL}/support/admin/tickets`);
      renderTicketsList(response.data, 'adminTicketsList', true);
    } catch (e) { alert(e.message); }
  }

  async function adminUpdateStatus() {
    const status = document.getElementById('adminStatusSelect').value;
    try {
      await authFetch(`${BASE_URL}/support/admin/tickets/${CURRENT_TICKET_ID}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      alert('Status updated successfully!');
    } catch(e) { alert(e.message); }
  }


  // --- SHARED UI LOGIC ---

  function renderTicketsList(tickets, containerId, isAdmin = false) {
    const list = document.getElementById(containerId);
    list.innerHTML = '';
    
    tickets.forEach(ticket => {
      const card = document.createElement('div');
      card.className = 'ticket-card';
      card.onclick = () => openChat(ticket.id, ticket.subject, ticket.status);
      
      const extraInfo = isAdmin && ticket.user ? `<div style="font-size:12px; color:#1a5c68">By: ${ticket.user.email}</div>` : '';

      card.innerHTML = `
        <div>
          <div style="font-weight: bold; font-size: 16px;">${ticket.subject}</div>
          ${extraInfo}
          <div style="font-size: 12px; color: #888; margin-top: 5px;">${new Date(ticket.createdAt).toLocaleString()}</div>
        </div>
        <span class="badge ${ticket.status}">${ticket.status}</span>
      `;
      list.appendChild(card);
    });
  }

  async function openChat(ticketId, subject, status) {
    CURRENT_TICKET_ID = ticketId;
    document.getElementById('mainContent').classList.add('hidden');
    document.getElementById('chatSection').classList.remove('hidden');
    document.getElementById('chatTitle').innerText = `Chat: ${subject}`;
    
    // Configure Buttons
    const resolveBtn = document.getElementById('userResolveBtn');
    const adminActions = document.getElementById('adminActions');
    
    if (USER_ROLE === 'ADMIN') {
      resolveBtn.classList.add('hidden');
      adminActions.classList.remove('hidden');
      document.getElementById('adminStatusSelect').value = status;
    } else {
      adminActions.classList.add('hidden');
      if (status !== 'RESOLVED') resolveBtn.classList.remove('hidden');
      else resolveBtn.classList.add('hidden');
    }
    
    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML = 'Loading history...';

    // 1. Fetch History via REST
    try {
      const response = await authFetch(`${BASE_URL}/support/tickets/${ticketId}/messages`);
      chatBox.innerHTML = ''; 
      
      appendMessage('Ticket Subject', response.data.ticket.subject, 'other');

      response.data.messages.forEach(msg => {
        const isMe = msg.senderId === USER_ID;
        appendMessage(isMe ? 'You' : msg.sender?.fullName || 'Other', msg.message, isMe ? 'me' : 'other', msg.attachmentUrl, msg.attachmentType);
      });

    } catch (e) {
      chatBox.innerHTML = `<span style="color:red">Failed to load history: ${e.message}</span>`;
      return;
    }

    // 2. Connect Socket.io
    initSocket();
  }

  function appendMessage(senderName, text, type, attachmentUrl = null, attachmentType = null) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    
    let contentHtml = text ? `<div>${text}</div>` : '';
    
    if (attachmentUrl) {
      if (attachmentType && attachmentType.startsWith('image')) {
        contentHtml += `<div style="margin-top: 5px;"><img src="${attachmentUrl}" style="max-width: 100%; border-radius: 4px;" alt="Attachment"></div>`;
      } else {
        contentHtml += `<div style="margin-top: 5px;"><a href="${attachmentUrl}" target="_blank" style="color: #1a5c68; text-decoration: underline;">📎 View Attachment</a></div>`;
      }
    }

    div.innerHTML = `<div class="msg-sender">${senderName}</div>${contentHtml}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function initSocket() {
    if (socket) socket.disconnect();
    
    socket = io('http://localhost:5000/support');
    
    socket.on('connect', () => {
      document.getElementById('socketStatus').innerText = 'Socket Status: Connected';
      socket.emit('joinTicket', { ticketId: CURRENT_TICKET_ID, userId: USER_ID }, (res) => {
        if (res.event === 'error') alert('Socket join error: ' + res.data.message);
      });
    });

    socket.on('receiveMessage', (data) => {
      if (data.senderId !== USER_ID) {
        appendMessage(data.sender?.fullName || 'Other', data.message, 'other', data.attachmentUrl, data.attachmentType);
      }
    });

    socket.on('disconnect', () => {
      document.getElementById('socketStatus').innerText = 'Socket Status: Disconnected';
    });
  }

  async function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const fileInput = document.getElementById('chatAttachment');
    const message = input.value.trim();
    const file = fileInput.files[0];

    if (!message && !file) return;

    if (!socket || !socket.connected) return alert('Socket is disconnected.');

    let attachmentUrl = null;
    let attachmentType = null;

    if (file) {
      try {
        const formData = new FormData();
        formData.append('file', file);
        
        const res = await fetch(`${BASE_URL}/support/upload`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${JWT_TOKEN}` },
          body: formData
        });
        
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Upload failed');
        
        const uploadData = data.data || data;
        attachmentUrl = uploadData.url;
        attachmentType = file.type;
      } catch (e) {
        alert('File upload failed: ' + e.message);
        return;
      }
    }

    socket.emit('sendMessage', { ticketId: CURRENT_TICKET_ID, senderId: USER_ID, message, attachmentUrl, attachmentType }, (res) => {
      if (res.event === 'error') {
        alert(res.data.message); 
      } else {
        appendMessage('You', message, 'me', attachmentUrl, attachmentType);
        input.value = '';
        fileInput.value = '';
      }
    });
  }

  function closeChat() {
    if(socket) { socket.disconnect(); socket = null; }
    document.getElementById('chatSection').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    if(USER_ROLE === 'ADMIN') fetchAllTickets();
    else fetchMyTickets();
  }
</script>

</body>
</html>
