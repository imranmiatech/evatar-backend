<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Children Preview</title>
    <style>
      :root {
        --teal: #075d68;
        --teal-soft: #e8f5f6;
        --ink: #152331;
        --muted: #64737e;
        --line: #e4eaee;
        --screen: #f6f6f6;
        --danger: #cc3940;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #3f3f4f;
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .phone {
        width: min(100vw, 390px);
        min-height: 844px;
        background: var(--screen);
        border: 1px solid #202020;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .status {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: #fff;
        font-size: 14px;
        font-weight: 600;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .signal {
        width: 18px;
        height: 12px;
        background: linear-gradient(
          90deg,
          #1d252b 3px,
          transparent 3px 5px,
          #1d252b 5px 8px,
          transparent 8px 10px,
          #1d252b 10px 14px
        );
        border-radius: 2px;
      }

      .battery {
        width: 24px;
        height: 12px;
        border: 2px solid #1d252b;
        border-radius: 4px;
        position: relative;
      }

      .battery::before {
        content: '';
        position: absolute;
        right: -5px;
        top: 3px;
        width: 3px;
        height: 4px;
        background: #1d252b;
        border-radius: 0 2px 2px 0;
      }

      .battery::after {
        content: '';
        position: absolute;
        inset: 2px;
        background: #1d252b;
        border-radius: 2px;
      }

      .topbar {
        height: 58px;
        display: grid;
        grid-template-columns: 48px 1fr 48px;
        align-items: center;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }

      .icon-button {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--teal);
        cursor: pointer;
      }

      .title {
        margin: 0;
        text-align: center;
        font-size: 18px;
        line-height: 1;
        font-weight: 700;
        color: #101820;
      }

      .content {
        padding: 14px 14px 24px;
      }

      .tools {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .refresh {
        border: 1px solid #b7d9df;
        background: #fff;
        color: var(--teal);
        border-radius: 8px;
        padding: 8px 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .card {
        min-height: 100px;
        display: grid;
        grid-template-columns: 74px 1fr 20px;
        align-items: center;
        gap: 8px;
        padding: 14px 14px 14px 12px;
        background: #fff;
        border-radius: 12px;
        border: 0;
        text-align: left;
        cursor: pointer;
        width: 100%;
      }

      .child-avatar {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #e7f2f4;
        background: var(--teal-soft);
      }

      .child-name {
        margin: 0 0 4px;
        font-size: 18px;
        line-height: 1.15;
        font-weight: 800;
        color: #263544;
      }

      .age {
        margin: 0 0 12px;
        color: #384b58;
        font-size: 12px;
        line-height: 1.2;
      }

      .assigned {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .nanny-stack {
        display: flex;
        align-items: center;
        min-width: 44px;
      }

      .nanny-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #fff;
        background: var(--teal-soft);
      }

      .nanny-avatar + .nanny-avatar {
        margin-left: -10px;
      }

      .assigned-text {
        color: var(--teal);
        font-size: 12px;
        line-height: 1.25;
      }

      .chevron {
        color: #65737d;
        font-size: 24px;
      }

      .add-card {
        height: 98px;
        margin-top: 40px;
        display: grid;
        place-items: center;
        border: 1.5px dashed #93cbd2;
        border-radius: 12px;
        color: var(--teal);
        background: transparent;
      }

      .add-inner {
        display: grid;
        place-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 700;
      }

      .plus {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e7f2f4;
        color: var(--teal);
        font-size: 24px;
        line-height: 1;
      }

      .message {
        padding: 18px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--muted);
        line-height: 1.45;
      }

      .message strong {
        display: block;
        color: var(--ink);
        margin-bottom: 6px;
      }

      .message.error strong {
        color: var(--danger);
      }

      .edit {
        color: #263544;
      }

      .profile {
        padding: 18px 16px 24px;
      }

      .profile-head {
        margin-bottom: 12px;
      }

      .profile-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--teal);
        background: var(--teal-soft);
      }

      .profile-name {
        margin: 8px 0 4px;
        font-size: 17px;
        font-weight: 800;
      }

      .caregiver-row {
        width: 100%;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 0;
        border-radius: 8px;
        padding: 0 14px;
        background: #eef1f2;
        color: var(--teal);
        font-weight: 800;
        cursor: pointer;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 12px 0;
      }

      .stat {
        height: 58px;
        display: grid;
        place-items: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--teal);
        font-size: 11px;
      }

      .stat strong {
        display: block;
        color: var(--teal);
        font-size: 15px;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 10px -16px 14px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .tab {
        height: 48px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: #fff;
        color: #2c3a43;
        cursor: pointer;
      }

      .tab.active {
        border-bottom-color: var(--teal);
        color: var(--teal);
      }

      .tab-panel {
        display: grid;
        gap: 12px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .memory-img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 8px;
        background: var(--teal-soft);
      }

      .story-card {
        min-height: 176px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 12px;
        border-radius: 12px;
        background-position: center;
        background-size: cover;
        color: #fff;
        overflow: hidden;
        position: relative;
      }

      .story-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 30%,
          rgba(0, 0, 0, 0.72)
        );
      }

      .story-card > * {
        position: relative;
      }

      .story-date {
        font-size: 10px;
        opacity: 0.9;
      }

      .story-title {
        margin: 3px 0 10px;
        font-size: 15px;
        font-weight: 800;
      }

      .play {
        width: 100%;
        height: 34px;
        border: 0;
        border-radius: 6px;
        background: #fff;
        color: #1b2b35;
        font-size: 11px;
        font-weight: 800;
      }

      .chip-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 8px 0 16px;
      }

      .chip {
        padding: 8px 10px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid var(--line);
        color: #4b5964;
        font-size: 11px;
      }

      .section-title {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
      }

      .snapshot {
        margin-top: 18px;
        padding: 24px 18px;
        border-radius: 8px;
        background: var(--teal);
        color: #fff;
        text-align: center;
      }

      .snapshot strong {
        display: block;
        margin-bottom: 10px;
        font-size: 15px;
      }

      .snapshot p {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="status">
        <span>9:41</span>
        <div class="status-icons">
          <span class="signal" aria-hidden="true"></span>
          <span class="battery" aria-hidden="true"></span>
        </div>
      </div>

      <header class="topbar">
        <button
          class="icon-button"
          type="button"
          aria-label="Back"
          id="backButton"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path
              d="M15 18l-6-6 6-6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <h1 class="title" id="pageTitle">My Children</h1>
        <button class="icon-button edit hidden" type="button" aria-label="Edit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M12 20h9"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
            <path
              d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </header>

      <section class="content" id="listScreen">
        <div class="tools">
          <span id="statusText">Loading children...</span>
          <button class="refresh" type="button" id="refreshButton">
            Refresh
          </button>
        </div>

        <div id="childrenList" class="list">
          <div class="message">
            <strong>Connecting</strong>
            Signing in as p@e.com and loading the child list.
          </div>
        </div>

        <button class="add-card" type="button">
          <span class="add-inner">
            <span class="plus">+</span>
            <span>Add another child</span>
          </span>
        </button>
      </section>

      <section class="profile hidden" id="profileScreen">
        <div id="profileContent" class="tab-panel"></div>
      </section>
    </main>

    <script>
      const API_BASE = 'http://localhost:5000/api/v1';
      const LOGIN = {
        email: 'p@e.com',
        password: '123456',
      };

      const statusText = document.querySelector('#statusText');
      const childrenList = document.querySelector('#childrenList');
      const refreshButton = document.querySelector('#refreshButton');
      const backButton = document.querySelector('#backButton');
      const pageTitle = document.querySelector('#pageTitle');
      const listScreen = document.querySelector('#listScreen');
      const profileScreen = document.querySelector('#profileScreen');
      const profileContent = document.querySelector('#profileContent');
      const editButton = document.querySelector('.edit');
      let authToken = null;
      let activeChildId = null;
      let activeProfile = null;

      function fallbackAvatar(name) {
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(
          name,
        )}&background=e7f2f4&color=075d68&bold=true&size=160`;
      }

      function getResponseData(payload) {
        return payload?.data?.data ?? payload?.data ?? payload;
      }

      async function signIn() {
        if (authToken) {
          return authToken;
        }

        const response = await fetch(`${API_BASE}/auth/signin`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(LOGIN),
        });

        const payload = await response.json();

        if (!response.ok || !payload.success) {
          throw new Error(payload.message || 'Signin failed');
        }

        const data = getResponseData(payload);
        const token = data?.accessToken;

        if (!token) {
          throw new Error('Signin response did not include an access token');
        }

        authToken = token;
        return authToken;
      }

      async function fetchAuthed(path) {
        const token = await signIn();
        const response = await fetch(`${API_BASE}${path}`, {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });
        const payload = await response.json();

        if (!response.ok || !payload.success) {
          throw new Error(payload.message || `Could not load ${path}`);
        }

        return getResponseData(payload);
      }

      async function loadChildren() {
        statusText.textContent = 'Loading children...';
        childrenList.innerHTML = `
          <div class="message">
            <strong>Connecting</strong>
            Signing in as p@e.com and loading the child list.
          </div>
        `;

        try {
          const data = await fetchAuthed('/my-children');
          renderChildren(data.children || []);
          statusText.textContent = `${data.total || 0} children found`;
        } catch (error) {
          statusText.textContent = 'Could not load';
          childrenList.innerHTML = `
            <div class="message error">
              <strong>${error.message}</strong>
              Make sure the backend is running on http://localhost:5000.
            </div>
          `;
        }
      }

      function renderChildren(children) {
        if (!children.length) {
          childrenList.innerHTML = `
            <div class="message">
              <strong>No children yet</strong>
              Add seed data, then refresh this page.
            </div>
          `;
          return;
        }

        childrenList.innerHTML = children
          .map((child) => {
            const nannies = child.assignedNannies || [];
            const nannyImages = nannies
              .slice(0, 3)
              .map(
                (nanny) => `
                  <img
                    class="nanny-avatar"
                    src="${nanny.avatar || fallbackAvatar(nanny.name)}"
                    alt="${nanny.name}"
                  />
                `,
              )
              .join('');

            return `
              <button class="card" type="button" data-child-id="${child.id}">
                <img
                  class="child-avatar"
                  src="${child.avatar || fallbackAvatar(child.name)}"
                  alt="${child.name}"
                />
                <div>
                  <h2 class="child-name">${child.name}</h2>
                  <p class="age">${child.age || 'Age not added'}</p>
                  <div class="assigned">
                    <span class="nanny-stack">${nannyImages}</span>
                    <span class="assigned-text">${child.assignedNannyText}</span>
                  </div>
                </div>
                <span class="chevron">&gt;</span>
              </button>
            `;
          })
          .join('');

        childrenList.querySelectorAll('[data-child-id]').forEach((card) => {
          card.addEventListener('click', () =>
            openProfile(card.dataset.childId),
          );
        });
      }

      async function openProfile(childId) {
        activeChildId = childId;
        showProfileShell();

        try {
          activeProfile = await fetchAuthed(`/my-children/${childId}`);
          pageTitle.textContent = `${activeProfile.name}'s profile`;
          renderProfile('memories');
        } catch (error) {
          profileContent.innerHTML = renderError(error.message);
        }
      }

      function showProfileShell() {
        listScreen.classList.add('hidden');
        profileScreen.classList.remove('hidden');
        editButton.classList.remove('hidden');
        statusText.textContent = '';
        pageTitle.textContent = 'Profile';
        profileContent.innerHTML = `
          <div class="message">
            <strong>Loading profile</strong>
            Fetching child profile and tab data.
          </div>
        `;
      }

      function showList() {
        activeChildId = null;
        activeProfile = null;
        profileScreen.classList.add('hidden');
        listScreen.classList.remove('hidden');
        editButton.classList.add('hidden');
        pageTitle.textContent = 'My Children';
      }

      function renderProfile(tab) {
        profileContent.innerHTML = `
          ${renderProfileHeader()}
          <div class="tabs">
            ${renderTabButton('memories', tab, 'Grid')}
            ${renderTabButton('stories', tab, 'Book')}
            ${renderTabButton('personality', tab, 'Prefs')}
          </div>
          <div id="tabPanel" class="tab-panel">
            <div class="message"><strong>Loading</strong>Loading ${tab}.</div>
          </div>
        `;

        profileContent.querySelectorAll('[data-tab]').forEach((button) => {
          button.addEventListener('click', () =>
            renderProfile(button.dataset.tab),
          );
        });

        loadTab(tab);
      }

      function renderProfileHeader() {
        const caregivers = activeProfile.caregivers || [];

        return `
          <section class="profile-head">
            <img
              class="profile-avatar"
              src="${activeProfile.avatar || fallbackAvatar(activeProfile.name)}"
              alt="${activeProfile.name}"
            />
            <h2 class="profile-name">${activeProfile.name}</h2>
            <p class="age">${activeProfile.age || 'Age not added'}</p>
            <button class="caregiver-row" type="button">
              <span>Manage Caregivers</span>
              <span>${caregivers.length} &gt;</span>
            </button>
            <div class="stats">
              <div class="stat"><span><strong>${activeProfile.stats?.memories || 0}</strong>Memories</span></div>
              <div class="stat"><span><strong>${activeProfile.stats?.stories || 0}</strong>Stories</span></div>
            </div>
          </section>
        `;
      }

      function renderTabButton(name, active, label) {
        return `
          <button class="tab ${name === active ? 'active' : ''}" type="button" data-tab="${name}">
            ${label}
          </button>
        `;
      }

      async function loadTab(tab) {
        const panel = document.querySelector('#tabPanel');

        try {
          if (tab === 'memories') {
            const data = await fetchAuthed(
              `/my-children/${activeChildId}/memories`,
            );
            panel.innerHTML = renderMemories(data.memories || []);
            return;
          }

          if (tab === 'stories') {
            const data = await fetchAuthed(
              `/my-children/${activeChildId}/bedtime-stories`,
            );
            panel.innerHTML = renderStories(data.stories || []);
            return;
          }

          const data = await fetchAuthed(
            `/my-children/${activeChildId}/personality`,
          );
          panel.innerHTML = renderPersonality(data);
        } catch (error) {
          panel.innerHTML = renderError(error.message);
        }
      }

      function renderMemories(memories) {
        if (!memories.length) {
          return renderEmpty('No memories yet');
        }

        return `
          <div class="gallery">
            ${memories
              .map(
                (memory) => `
                  <img
                    class="memory-img"
                    src="${memory.url}"
                    alt="${memory.title || 'Memory'}"
                  />
                `,
              )
              .join('')}
          </div>
        `;
      }

      function renderStories(stories) {
        if (!stories.length) {
          return renderEmpty('No bedtime stories yet');
        }

        return stories
          .map(
            (story) => `
              <article
                class="story-card"
                style="background-image: url('${story.coverImageUrl || fallbackAvatar(story.title)}')"
              >
                <span class="story-date">Generated ${formatDate(story.date)}</span>
                <h3 class="story-title">${story.title}</h3>
                <button class="play" type="button">Visit story</button>
              </article>
            `,
          )
          .join('');
      }

      function renderPersonality(data) {
        return `
          ${renderChipSection('Favorite Foods', data.favoriteFoods)}
          ${renderChipSection('Frequently Declined', data.declinedFoods)}
          ${renderChipSection('Favorite Activities', data.favoriteActivities)}
          ${renderChipSection('Low Engagement', data.lowEngagement)}
          <section class="snapshot">
            <strong>Personality Snapshot</strong>
            <p>${data.snapshot?.summary || 'No personality snapshot yet.'}</p>
          </section>
        `;
      }

      function renderChipSection(title, items = []) {
        return `
          <section>
            <h3 class="section-title">${title}</h3>
            <div class="chip-group">
              ${
                items.length
                  ? items
                      .map((item) => `<span class="chip">${item}</span>`)
                      .join('')
                  : '<span class="chip">No data yet</span>'
              }
            </div>
          </section>
        `;
      }

      function renderEmpty(message) {
        return `<div class="message"><strong>${message}</strong>Try another tab or add more seed data.</div>`;
      }

      function renderError(message) {
        return `
          <div class="message error">
            <strong>${message}</strong>
            Make sure the backend is running on http://localhost:5000.
          </div>
        `;
      }

      function formatDate(value) {
        if (!value) {
          return '';
        }

        return new Intl.DateTimeFormat('en', {
          month: 'short',
          day: 'numeric',
        }).format(new Date(value));
      }

      refreshButton.addEventListener('click', loadChildren);
      backButton.addEventListener('click', () => {
        if (activeChildId) {
          showList();
          return;
        }
      });
      loadChildren();
    </script>
  </body>
</html>
