<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KYC Document Flow Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #eef3f4;
        color: #102a30;
      }

      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px;
      }

      .panel {
        background: #ffffff;
        border: 1px solid #d7e1e3;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 16px;
      }

      h1,
      h2,
      h3 {
        margin: 0 0 12px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 17px;
      }

      h3 {
        font-size: 14px;
      }

      label {
        display: block;
        margin: 10px 0 6px;
        color: #526a70;
        font-size: 13px;
      }

      input,
      select,
      button {
        width: 100%;
        border-radius: 8px;
        font: inherit;
      }

      input,
      select {
        border: 1px solid #c8d7da;
        padding: 11px 12px;
        background: #fbfdfd;
        color: #102a30;
      }

      button {
        border: 0;
        padding: 11px 14px;
        background: #075c66;
        color: #ffffff;
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: #e8eff0;
        color: #14353b;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .doc-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .doc-card {
        border: 1px solid #d7e1e3;
        background: #f9fbfb;
        color: #102a30;
        text-align: left;
      }

      .doc-card.active {
        border-color: #075c66;
        background: #e8f5f6;
      }

      .hidden {
        display: none;
      }

      .status {
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef8f9;
        color: #075c66;
        font-size: 13px;
        word-break: break-word;
      }

      .status.error {
        background: #fff0f0;
        color: #9d1d1d;
      }

      .tiny {
        color: #6b8186;
        font-size: 12px;
        margin-top: 2px;
      }

      .preview {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .thumb {
        border: 1px solid #d7e1e3;
        border-radius: 8px;
        padding: 8px;
        background: #f9fbfb;
      }

      .thumb img {
        width: 100%;
        height: 130px;
        object-fit: cover;
        border-radius: 6px;
        background: #dce6e8;
      }

      pre {
        margin: 0;
        padding: 12px;
        border-radius: 8px;
        background: #102a30;
        color: #e7fbff;
        overflow: auto;
        white-space: pre-wrap;
      }

      @media (max-width: 720px) {
        .page {
          padding: 14px;
        }

        .grid,
        .doc-options,
        .preview {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Parent Account + Document Submit Test</h1>
        <label for="baseUrl">API Base URL</label>
        <input id="baseUrl" value="http://localhost:5000/api/v1" />
        <div id="status" class="status" style="margin-top: 12px">
          Start with signup or login.
        </div>
      </section>

      <section class="panel">
        <h2>1. Create Parent Account</h2>
        <div class="grid">
          <div>
            <label for="fullName">Full Name</label>
            <input id="fullName" value="Parent Flow Test" />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" value="" placeholder="parent-test@example.com" />
          </div>
          <div>
            <label for="phoneNumber">Phone Number</label>
            <input id="phoneNumber" value="" placeholder="+8801..." />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" value="123456" />
          </div>
          <div>
            <label for="relationType">Relationship</label>
            <select id="relationType">
              <option value="FATHER">Father</option>
              <option value="MOTHER">Mother</option>
              <option value="GUARDIAN">Guardian</option>
            </select>
          </div>
          <div>
            <label for="city">City</label>
            <input id="city" value="Dhaka" />
          </div>
        </div>
        <button id="signupBtn" style="margin-top: 12px">Signup Parent</button>
        <div class="tiny">
          Signup creates OTP in backend. Current backend has no signup OTP verify
          endpoint yet, so login is used to continue document upload testing.
        </div>
      </section>

      <section class="panel">
        <h2>2. Login</h2>
        <div class="grid">
          <div>
            <label for="loginEmail">Email</label>
            <input id="loginEmail" value="p@e.com" />
          </div>
          <div>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" value="123456" />
          </div>
        </div>
        <button id="loginBtn" style="margin-top: 12px">Login</button>
      </section>

      <section class="panel">
        <h2>3. Submit Documents</h2>
        <div class="doc-options">
          <button id="passportOption" type="button" class="doc-card">
            <strong>Passport</strong>
            <div class="tiny">Upload one passport page image.</div>
          </button>
          <button id="nidOption" type="button" class="doc-card active">
            <strong>National ID Card</strong>
            <div class="tiny">Upload front and back side images.</div>
          </button>
        </div>

        <input id="docType" type="hidden" value="NATIONAL_ID" />

        <div id="passportFields" class="hidden">
          <label for="passportFile">Passport image</label>
          <input id="passportFile" type="file" accept="image/*" />
        </div>

        <div id="nidFields">
          <div class="grid">
            <div>
              <label for="nidFrontFile">NID front image</label>
              <input id="nidFrontFile" type="file" accept="image/*" />
            </div>
            <div>
              <label for="nidBackFile">NID back image</label>
              <input id="nidBackFile" type="file" accept="image/*" />
            </div>
          </div>
        </div>

        <div id="preview" class="preview" style="margin-top: 12px"></div>
        <div class="grid" style="margin-top: 12px">
          <button id="submitDocsBtn">Submit Documents</button>
          <button id="loadDocsBtn" class="secondary">Load Saved Documents</button>
        </div>
      </section>

      <section class="panel">
        <h2>Output</h2>
        <pre id="output">No output yet.</pre>
      </section>
    </main>

    <script>
      const state = {
        token: localStorage.getItem('kycFlowToken') || '',
      };

      const el = {
        baseUrl: document.getElementById('baseUrl'),
        status: document.getElementById('status'),
        output: document.getElementById('output'),
        fullName: document.getElementById('fullName'),
        email: document.getElementById('email'),
        phoneNumber: document.getElementById('phoneNumber'),
        password: document.getElementById('password'),
        relationType: document.getElementById('relationType'),
        city: document.getElementById('city'),
        loginEmail: document.getElementById('loginEmail'),
        loginPassword: document.getElementById('loginPassword'),
        signupBtn: document.getElementById('signupBtn'),
        loginBtn: document.getElementById('loginBtn'),
        passportOption: document.getElementById('passportOption'),
        nidOption: document.getElementById('nidOption'),
        docType: document.getElementById('docType'),
        passportFields: document.getElementById('passportFields'),
        nidFields: document.getElementById('nidFields'),
        passportFile: document.getElementById('passportFile'),
        nidFrontFile: document.getElementById('nidFrontFile'),
        nidBackFile: document.getElementById('nidBackFile'),
        preview: document.getElementById('preview'),
        submitDocsBtn: document.getElementById('submitDocsBtn'),
        loadDocsBtn: document.getElementById('loadDocsBtn'),
      };

      el.email.value = `parent-${Date.now()}@example.com`;

      function apiPath(path) {
        return `${el.baseUrl.value.replace(/\/$/, '')}${path}`;
      }

      async function api(path, options = {}) {
        const headers = {
          ...(options.body instanceof FormData
            ? {}
            : { 'Content-Type': 'application/json' }),
          ...(options.headers || {}),
        };

        if (state.token) {
          headers.Authorization = `Bearer ${state.token}`;
        }

        const response = await fetch(apiPath(path), {
          ...options,
          headers,
          credentials: 'include',
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || `HTTP ${response.status}`);
        }

        return payload;
      }

      function setStatus(message, isError = false) {
        el.status.textContent = message;
        el.status.classList.toggle('error', isError);
      }

      function showOutput(value) {
        el.output.textContent = JSON.stringify(value, null, 2);
      }

      async function signup() {
        const payload = {
          fullName: el.fullName.value.trim(),
          email: el.email.value.trim(),
          phoneNumber: el.phoneNumber.value.trim() || undefined,
          password: el.password.value,
          role: 'PARENT',
          relationType: el.relationType.value,
          street: 'Test Street',
          postCode: '12345',
          city: el.city.value.trim(),
          state: el.city.value.trim(),
          country: 'Bangladesh',
          preferredLanguage: 'en',
          otpDeliveryMethod: 'EMAIL',
        };

        const response = await api('/auth/signup', {
          method: 'POST',
          body: JSON.stringify(payload),
        });

        el.loginEmail.value = payload.email;
        el.loginPassword.value = payload.password;
        setStatus('Signup done. OTP was generated/sent by backend. Login to continue document upload.');
        showOutput(response);
      }

      async function login() {
        const response = await api('/auth/signin', {
          method: 'POST',
          body: JSON.stringify({
            email: el.loginEmail.value.trim(),
            password: el.loginPassword.value,
          }),
        });

        state.token = response.data.accessToken;
        localStorage.setItem('kycFlowToken', state.token);
        setStatus(`Logged in as ${response.data.user.email}`);
        showOutput(response);
      }

      function selectDocType(type) {
        el.docType.value = type;
        const isPassport = type === 'PASSPORT';
        el.passportOption.classList.toggle('active', isPassport);
        el.nidOption.classList.toggle('active', !isPassport);
        el.passportFields.classList.toggle('hidden', !isPassport);
        el.nidFields.classList.toggle('hidden', isPassport);
        updatePreview();
      }

      function updatePreview() {
        const files =
          el.docType.value === 'PASSPORT'
            ? [{ label: 'Passport', file: el.passportFile.files[0] }]
            : [
                { label: 'NID Front', file: el.nidFrontFile.files[0] },
                { label: 'NID Back', file: el.nidBackFile.files[0] },
              ];

        el.preview.innerHTML = '';
        files
          .filter((item) => item.file)
          .forEach((item) => {
            const card = document.createElement('div');
            card.className = 'thumb';
            card.innerHTML = `
              <img src="${URL.createObjectURL(item.file)}" alt="${item.label}" />
              <h3>${item.label}</h3>
              <div class="tiny">${item.file.name}</div>
            `;
            el.preview.append(card);
          });
      }

      async function submitDocuments() {
        if (!state.token) {
          throw new Error('Login first');
        }

        const form = new FormData();
        form.append('docType', el.docType.value);

        if (el.docType.value === 'PASSPORT') {
          const passport = el.passportFile.files[0];
          if (!passport) throw new Error('Select passport image first');
          form.append('passport', passport);
        } else {
          const nidFront = el.nidFrontFile.files[0];
          const nidBack = el.nidBackFile.files[0];
          if (!nidFront || !nidBack) {
            throw new Error('Select NID front and back images first');
          }
          form.append('nidFront', nidFront);
          form.append('nidBack', nidBack);
        }

        const response = await api('/kyc/documents', {
          method: 'POST',
          body: form,
        });
        setStatus('Documents saved successfully');
        showOutput(response);
      }

      async function loadDocuments() {
        if (!state.token) {
          throw new Error('Login first');
        }

        const response = await api('/kyc/documents');
        showOutput(response);
      }

      function showError(error) {
        console.error(error);
        setStatus(error.message || 'Something went wrong', true);
      }

      el.signupBtn.addEventListener('click', () => signup().catch(showError));
      el.loginBtn.addEventListener('click', () => login().catch(showError));
      el.passportOption.addEventListener('click', () => selectDocType('PASSPORT'));
      el.nidOption.addEventListener('click', () => selectDocType('NATIONAL_ID'));
      el.passportFile.addEventListener('change', updatePreview);
      el.nidFrontFile.addEventListener('change', updatePreview);
      el.nidBackFile.addEventListener('change', updatePreview);
      el.submitDocsBtn.addEventListener('click', () =>
        submitDocuments().catch(showError),
      );
      el.loadDocsBtn.addEventListener('click', () =>
        loadDocuments().catch(showError),
      );

      if (state.token) {
        setStatus('Token loaded. You can submit or load documents.');
      }
    </script>
  </body>
</html>
