<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Login Language Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #eef3f4;
        color: #102a30;
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
      }

      .panel {
        background: #fff;
        border: 1px solid #d7e1e3;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 16px;
      }

      h1,
      h2 {
        margin: 0 0 12px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 17px;
      }

      label {
        display: block;
        margin: 10px 0 6px;
        color: #526a70;
        font-size: 13px;
      }

      input,
      button {
        width: 100%;
        border-radius: 8px;
        font: inherit;
      }

      input {
        border: 1px solid #c8d7da;
        padding: 11px 12px;
        background: #fbfdfd;
        color: #102a30;
      }

      button {
        border: 0;
        padding: 11px 14px;
        background: #075c66;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: #e8eff0;
        color: #14353b;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .languages {
        display: grid;
        gap: 10px;
      }

      .language-card {
        width: 100%;
        display: grid;
        grid-template-columns: 42px 1fr auto;
        align-items: center;
        gap: 10px;
        border: 1px solid #d7e1e3;
        background: #f9fbfb;
        color: #102a30;
        text-align: left;
      }

      .language-card.active {
        border-color: #075c66;
        background: #e8f5f6;
      }

      .icon {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: #e9eef0;
        color: #075c66;
        font-weight: 800;
      }

      .tiny {
        color: #6b8186;
        font-size: 12px;
        margin-top: 2px;
      }

      .status {
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef8f9;
        color: #075c66;
        font-size: 13px;
        word-break: break-word;
      }

      .status.error {
        background: #fff0f0;
        color: #9d1d1d;
      }

      .profile {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .kv {
        border: 1px solid #d7e1e3;
        border-radius: 8px;
        padding: 10px;
        background: #fbfdfd;
      }

      .kv span {
        display: block;
        color: #6b8186;
        font-size: 11px;
      }

      .kv strong {
        display: block;
        margin-top: 4px;
        word-break: break-word;
      }

      pre {
        min-height: 260px;
        max-height: 540px;
        margin: 0;
        padding: 12px;
        border-radius: 8px;
        background: #102a30;
        color: #e7fbff;
        overflow: auto;
        white-space: pre-wrap;
      }

      @media (max-width: 820px) {
        .page {
          padding: 14px;
        }

        .grid,
        .row,
        .profile {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <h1>Login + Profile + Language Test</h1>
        <div class="row">
          <div>
            <label for="baseUrl">API Base URL</label>
            <input id="baseUrl" value="http://localhost:5000/api/v1" />
          </div>
          <div>
            <label for="tokenView">Token</label>
            <input id="tokenView" readonly value="No token" />
          </div>
        </div>
      </section>

      <div class="grid">
        <section>
          <div class="panel">
            <h2>Login</h2>
            <label for="email">Email</label>
            <input id="email" value="p@e.com" />
            <label for="password">Password</label>
            <input id="password" type="password" value="123456" />
            <button id="loginBtn" style="margin-top: 12px">Login</button>
            <div id="status" class="status" style="margin-top: 12px">
              Ready.
            </div>
          </div>

          <div class="panel">
            <h2>Languages</h2>
            <div id="languages" class="languages"></div>
            <button id="saveLanguageBtn" style="margin-top: 12px">
              Save Language
            </button>
          </div>

          <div class="panel">
            <h2>Actions</h2>
            <label for="dbFullName">Real DB fullName test</label>
            <input id="dbFullName" value="I am a parent from Dubai" />
            <button id="saveDbTextBtn" class="secondary" style="margin-top: 10px">
              Save Text To Database
            </button>
            <div class="row">
              <button id="loadProfileBtn">Load Profile</button>
              <button id="translatedProfileBtn" class="secondary">
                Translated
              </button>
            </div>
            <button id="compareBtn" style="margin-top: 10px">
              Compare English vs Selected
            </button>
          </div>
        </section>

        <section>
          <div class="panel">
            <h2>Profile Preview</h2>
            <div id="profilePreview" class="profile"></div>
          </div>

          <div class="panel">
            <h2>Output</h2>
            <pre id="output">No output yet.</pre>
          </div>
        </section>
      </div>
    </main>

    <script>
      const state = {
        token: localStorage.getItem('profileLanguageToken') || '',
        selectedLanguage:
          localStorage.getItem('profileLanguageSelected') || 'en',
      };

      const languageItems = [
        { code: 'en', label: 'English (EN)', native: 'Default System Language', icon: '🌐' },
        { code: 'ar', label: 'Arabic', native: 'عربية', icon: '文' },
        { code: 'fil', label: 'Filipino', native: 'Wikang Filipino', icon: '◔' },
        { code: 'si', label: 'Sinhala', native: 'සිංහල', icon: 'සි' },
      ];

      const el = {
        baseUrl: document.getElementById('baseUrl'),
        tokenView: document.getElementById('tokenView'),
        email: document.getElementById('email'),
        password: document.getElementById('password'),
        loginBtn: document.getElementById('loginBtn'),
        languages: document.getElementById('languages'),
        saveLanguageBtn: document.getElementById('saveLanguageBtn'),
        dbFullName: document.getElementById('dbFullName'),
        saveDbTextBtn: document.getElementById('saveDbTextBtn'),
        loadProfileBtn: document.getElementById('loadProfileBtn'),
        translatedProfileBtn: document.getElementById('translatedProfileBtn'),
        compareBtn: document.getElementById('compareBtn'),
        profilePreview: document.getElementById('profilePreview'),
        status: document.getElementById('status'),
        output: document.getElementById('output'),
      };

      function apiPath(path) {
        return `${el.baseUrl.value.replace(/\/$/, '')}${path}`;
      }

      async function api(path, options = {}) {
        const headers = {
          ...(options.body instanceof FormData
            ? {}
            : { 'Content-Type': 'application/json' }),
          ...(options.headers || {}),
        };

        if (state.token) {
          headers.Authorization = `Bearer ${state.token}`;
        }

        const response = await fetch(apiPath(path), {
          ...options,
          headers,
          credentials: 'include',
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || `HTTP ${response.status}`);
        }

        return payload;
      }

      function setStatus(message, isError = false) {
        el.status.textContent = message;
        el.status.classList.toggle('error', isError);
      }

      function showOutput(value) {
        el.output.textContent = JSON.stringify(value, null, 2);
      }

      function updateTokenView() {
        el.tokenView.value = state.token ? 'Token ready' : 'No token';
      }

      function renderLanguages() {
        el.languages.innerHTML = '';
        languageItems.forEach((language) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `language-card ${
            state.selectedLanguage === language.code ? 'active' : ''
          }`;
          button.innerHTML = `
            <span class="icon">${language.icon}</span>
            <span>
              <strong>${language.label}</strong>
              <div class="tiny">${language.native}</div>
            </span>
            <span>${state.selectedLanguage === language.code ? '✓' : ''}</span>
          `;
          button.addEventListener('click', () => {
            state.selectedLanguage = language.code;
            localStorage.setItem('profileLanguageSelected', language.code);
            renderLanguages();
          });
          el.languages.append(button);
        });
      }

      function renderProfile(data) {
        const profile = data?.data ?? data;
        const fields = [
          ['Full Name', profile.fullName],
          ['Email', profile.email],
          ['Phone', profile.phoneNumber],
          ['Role', profile.role],
          ['Status', profile.status],
          ['Verification', profile.verificationStatus],
          ['Language', profile.preferredLanguage],
          ['Created', profile.createdAt],
        ];

        el.profilePreview.innerHTML = fields
          .map(
            ([label, value]) => `
              <div class="kv">
                <span>${label}</span>
                <strong>${value ?? '-'}</strong>
              </div>
            `,
          )
          .join('');
      }

      async function login() {
        const response = await api('/auth/signin', {
          method: 'POST',
          body: JSON.stringify({
            email: el.email.value.trim(),
            password: el.password.value,
          }),
        });

        state.token = response.data?.accessToken || response.accessToken;
        localStorage.setItem('profileLanguageToken', state.token);
        updateTokenView();
        setStatus('Login successful.');
        showOutput(response);
        renderProfile(response.data?.user || response.user);
      }

      async function loadProfile(language) {
        const response = await api('/auth/me', {
          headers: language ? { 'x-language': language } : {},
        });
        setStatus(
          language
            ? `Profile loaded with x-language: ${language}`
            : 'Profile loaded.',
        );
        showOutput(response);
        renderProfile(response);
        return response;
      }

      async function saveLanguage() {
        const response = await api('/language/preferred', {
          method: 'PATCH',
          headers: { 'x-language': 'en' },
          body: JSON.stringify({ language: state.selectedLanguage }),
        });
        setStatus(`Preferred language saved: ${state.selectedLanguage}`);
        showOutput(response);
      }

      async function saveDbText() {
        const response = await api('/user/me', {
          method: 'PATCH',
          headers: { 'x-language': 'en' },
          body: JSON.stringify({
            fullName: el.dbFullName.value.trim(),
          }),
        });

        setStatus('Real database fullName saved. Now compare translation.');
        showOutput(response);
        renderProfile(response);
      }

      async function compareProfile() {
        const english = await loadProfile('en');
        const translated = await loadProfile(state.selectedLanguage);
        showOutput({
          selectedLanguage: state.selectedLanguage,
          english: english.data,
          translated: translated.data,
        });
        renderProfile(translated);
        setStatus('English vs selected language loaded.');
      }

      function showError(error) {
        console.error(error);
        setStatus(error.message || 'Something went wrong', true);
      }

      el.loginBtn.addEventListener('click', () => login().catch(showError));
      el.loadProfileBtn.addEventListener('click', () =>
        loadProfile('en').catch(showError),
      );
      el.translatedProfileBtn.addEventListener('click', () =>
        loadProfile(state.selectedLanguage).catch(showError),
      );
      el.saveLanguageBtn.addEventListener('click', () =>
        saveLanguage().catch(showError),
      );
      el.saveDbTextBtn.addEventListener('click', () =>
        saveDbText().catch(showError),
      );
      el.compareBtn.addEventListener('click', () =>
        compareProfile().catch(showError),
      );

      updateTokenView();
      renderLanguages();
    </script>
  </body>
</html>
