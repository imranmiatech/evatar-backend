<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvaTurner Message Chat Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #eef3f4;
        color: #13282d;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: 360px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        border-right: 1px solid #d6e0e2;
        background: #ffffff;
        padding: 20px;
        overflow: auto;
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-width: 0;
      }

      h1,
      h2,
      h3 {
        margin: 0;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 15px;
        margin: 24px 0 10px;
      }

      label {
        display: block;
        margin: 12px 0 6px;
        color: #49666d;
        font-size: 13px;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid #c8d7da;
        border-radius: 8px;
        padding: 11px 12px;
        background: #fbfdfd;
        color: #13282d;
        outline: none;
      }

      textarea {
        min-height: 76px;
        resize: vertical;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: #075c66;
        box-shadow: 0 0 0 3px rgba(7, 92, 102, 0.12);
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 11px 14px;
        background: #075c66;
        color: white;
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: #e8eff0;
        color: #14353b;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .row > * {
        flex: 1;
      }

      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef8f9;
        color: #075c66;
        font-size: 13px;
        word-break: break-word;
      }

      .status.error {
        background: #fff0f0;
        color: #9d1d1d;
      }

      .list {
        display: grid;
        gap: 8px;
      }

      .item {
        width: 100%;
        text-align: left;
        border: 1px solid #d8e2e4;
        background: #f9fbfb;
        color: #13282d;
        padding: 12px;
        font-weight: 500;
      }

      .item.active {
        border-color: #075c66;
        background: #e7f4f5;
      }

      .meta {
        color: #6d8388;
        font-size: 12px;
        margin-top: 3px;
      }

      .chat-header {
        background: #ffffff;
        border-bottom: 1px solid #d6e0e2;
        padding: 18px 24px;
      }

      .chat-title {
        font-size: 18px;
      }

      .messages {
        overflow: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .bubble {
        max-width: 680px;
        border-radius: 12px;
        padding: 12px 14px;
        background: white;
        border: 1px solid #dce5e7;
        align-self: flex-start;
      }

      .bubble.mine {
        align-self: flex-end;
        background: #075c66;
        border-color: #075c66;
        color: white;
      }

      .bubble .name {
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 5px;
      }

      .bubble .time {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.7;
      }

      .composer {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        padding: 16px 24px 22px;
        background: #ffffff;
        border-top: 1px solid #d6e0e2;
      }

      .file-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: #e8eff0;
        color: #14353b;
        cursor: pointer;
        font-weight: 800;
      }

      .file-button input {
        display: none;
      }

      .composer-stack {
        display: grid;
        gap: 8px;
      }

      .file-preview {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid #d6e0e2;
        border-radius: 8px;
        padding: 8px 10px;
        background: #f7fbfb;
        font-size: 13px;
      }

      .file-preview.visible {
        display: flex;
      }

      .file-preview img {
        width: 44px;
        height: 44px;
        border-radius: 6px;
        object-fit: cover;
      }

      .file-preview-info {
        min-width: 0;
        flex: 1;
      }

      .file-preview-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }

      .file-preview-size {
        color: #6d8388;
        font-size: 12px;
        margin-top: 2px;
      }

      .file-preview button {
        padding: 6px 9px;
      }

      .composer.dragging {
        background: #eef8f9;
        outline: 2px dashed #075c66;
        outline-offset: -8px;
      }

      .attachment-image {
        display: block;
        max-width: min(360px, 100%);
        max-height: 260px;
        margin-top: 8px;
        border-radius: 8px;
        object-fit: cover;
      }

      .empty {
        margin: auto;
        color: #6d8388;
        text-align: center;
      }

      .tiny {
        font-size: 12px;
        color: #6d8388;
      }

      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid #d6e0e2;
          max-height: 55vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Messages Test</h1>

        <label for="baseUrl">API Base URL</label>
        <input id="baseUrl" value="http://localhost:5000/api/v1" />

        <label for="socketUrl">Socket URL</label>
        <input id="socketUrl" value="http://localhost:5000/messages" />

        <label for="email">Email</label>
        <input id="email" placeholder="parent@example.com" />

        <label for="phoneNumber">Phone Number</label>
        <input id="phoneNumber" placeholder="+880..." />

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password" />

        <div class="row" style="margin-top: 12px">
          <button id="loginBtn">Login</button>
          <button id="logoutBtn" class="secondary">Clear</button>
        </div>

        <div id="status" class="status">Not logged in</div>

        <h2>Contacts</h2>
        <div class="row">
          <button id="loadContactsBtn" class="secondary">Load Contacts</button>
          <button id="createConversationBtn">Create Chat</button>
        </div>
        <label for="contactSelect">Select Contact</label>
        <select id="contactSelect"></select>

        <h2>Conversations</h2>
        <button id="loadConversationsBtn" class="secondary">
          Load Conversations
        </button>
        <div id="conversationList" class="list" style="margin-top: 10px"></div>
      </aside>

      <main class="main">
        <header class="chat-header">
          <h3 id="chatTitle" class="chat-title">No conversation selected</h3>
          <div id="chatMeta" class="tiny">Login and create/select a chat.</div>
        </header>

        <section id="messages" class="messages">
          <div class="empty">Messages will show here.</div>
        </section>

        <form id="composer" class="composer">
          <label class="file-button" title="Attach image or file">
            +
            <input id="fileInput" type="file" />
          </label>
          <div class="composer-stack">
            <div id="filePreview" class="file-preview">
              <img id="fileThumb" alt="" />
              <div class="file-preview-info">
                <div id="fileName" class="file-preview-name"></div>
                <div id="fileSize" class="file-preview-size"></div>
              </div>
              <button id="clearFileBtn" type="button" class="secondary">
                Remove
              </button>
            </div>
            <textarea
              id="messageInput"
              placeholder="Write your message"
            ></textarea>
          </div>
          <button id="sendBtn" type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="./node_modules/socket.io/client-dist/socket.io.min.js"></script>
    <script>
      const state = {
        token: localStorage.getItem('chatTestToken') || '',
        user: JSON.parse(localStorage.getItem('chatTestUser') || 'null'),
        socket: null,
        contacts: [],
        conversations: [],
        activeConversationId: '',
      };

      const el = {
        baseUrl: document.getElementById('baseUrl'),
        socketUrl: document.getElementById('socketUrl'),
        email: document.getElementById('email'),
        phoneNumber: document.getElementById('phoneNumber'),
        password: document.getElementById('password'),
        loginBtn: document.getElementById('loginBtn'),
        logoutBtn: document.getElementById('logoutBtn'),
        status: document.getElementById('status'),
        loadContactsBtn: document.getElementById('loadContactsBtn'),
        createConversationBtn: document.getElementById('createConversationBtn'),
        contactSelect: document.getElementById('contactSelect'),
        loadConversationsBtn: document.getElementById('loadConversationsBtn'),
        conversationList: document.getElementById('conversationList'),
        chatTitle: document.getElementById('chatTitle'),
        chatMeta: document.getElementById('chatMeta'),
        messages: document.getElementById('messages'),
        composer: document.getElementById('composer'),
        messageInput: document.getElementById('messageInput'),
        fileInput: document.getElementById('fileInput'),
        filePreview: document.getElementById('filePreview'),
        fileThumb: document.getElementById('fileThumb'),
        fileName: document.getElementById('fileName'),
        fileSize: document.getElementById('fileSize'),
        clearFileBtn: document.getElementById('clearFileBtn'),
        sendBtn: document.getElementById('sendBtn'),
      };

      function setStatus(message, isError = false) {
        el.status.textContent = message;
        el.status.classList.toggle('error', isError);
      }

      function apiPath(path) {
        return `${el.baseUrl.value.replace(/\/$/, '')}${path}`;
      }

      async function api(path, options = {}) {
        const headers = {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        };

        if (state.token) {
          headers.Authorization = `Bearer ${state.token}`;
        }

        const response = await fetch(apiPath(path), {
          ...options,
          headers,
          credentials: 'include',
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || payload.success === false) {
          throw new Error(payload.message || `HTTP ${response.status}`);
        }

        return payload.data;
      }

      async function sendMultipartMessage(conversationId, text, file) {
        const form = new FormData();
        if (text) form.append('message', text);
        if (file) form.append('file', file);

        const response = await fetch(
          apiPath(`/messages/conversations/${conversationId}/messages`),
          {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${state.token}`,
            },
            credentials: 'include',
            body: form,
          },
        );
        const payload = await response.json().catch(() => ({}));

        if (!response.ok || payload.success === false) {
          throw new Error(
            payload.message || `Send failed: HTTP ${response.status}`,
          );
        }

        return payload.data;
      }

      function connectSocket() {
        if (!state.user || !state.user.id || !window.io) return;
        if (state.socket) state.socket.disconnect();

        state.socket = io(el.socketUrl.value, {
          transports: ['websocket', 'polling'],
          auth: { token: state.token },
        });

        state.socket.on('connect', () => {
          setStatus(`Logged in as ${state.user.fullName} | socket connected`);
          state.socket.emit('joinUser', { userId: state.user.id });
          if (state.activeConversationId) joinConversationSocket();
        });

        state.socket.on('receiveMessage', (message) => {
          if (message.conversationId === state.activeConversationId) {
            appendMessage(message);
          }
          loadConversations().catch(console.error);
        });

        state.socket.on('conversationUpdated', () => {
          loadConversations().catch(console.error);
        });

        state.socket.on('disconnect', () => {
          setStatus('Socket disconnected', true);
        });
      }

      function joinConversationSocket() {
        if (!state.socket || !state.activeConversationId || !state.user) return;
        state.socket.emit('joinConversation', {
          conversationId: state.activeConversationId,
          userId: state.user.id,
        });
      }

      async function login() {
        const body = {
          password: el.password.value,
        };

        if (el.email.value.trim()) body.email = el.email.value.trim();
        if (el.phoneNumber.value.trim()) {
          body.phoneNumber = el.phoneNumber.value.trim();
        }

        const data = await api('/auth/signin', {
          method: 'POST',
          body: JSON.stringify(body),
        });

        state.token = data.accessToken;
        state.user = data.user;
        localStorage.setItem('chatTestToken', state.token);
        localStorage.setItem('chatTestUser', JSON.stringify(state.user));
        setStatus(`Logged in as ${state.user.fullName}`);
        connectSocket();
        await Promise.all([loadContacts(), loadConversations()]);
      }

      function clearLogin() {
        localStorage.removeItem('chatTestToken');
        localStorage.removeItem('chatTestUser');
        state.token = '';
        state.user = null;
        state.activeConversationId = '';
        if (state.socket) state.socket.disconnect();
        setStatus('Cleared login');
        renderConversations();
        renderMessages([]);
      }

      async function loadContacts() {
        state.contacts = await api('/messages/contacts');
        renderContacts();
      }

      function renderContacts() {
        el.contactSelect.innerHTML = '';
        state.contacts.forEach((contact) => {
          const option = document.createElement('option');
          option.value = contact.id;
          option.textContent = `${contact.fullName} (${contact.role})`;
          el.contactSelect.append(option);
        });
      }

      async function createConversation() {
        const participantId = el.contactSelect.value;
        if (!participantId) throw new Error('Select a contact first');

        const conversation = await api('/messages/conversations', {
          method: 'POST',
          body: JSON.stringify({ participantIds: [participantId] }),
        });

        state.activeConversationId = conversation.id;
        await loadConversations();
        await openConversation(conversation.id);
      }

      async function loadConversations() {
        state.conversations = await api('/messages/conversations');
        renderConversations();
      }

      function renderConversations() {
        el.conversationList.innerHTML = '';

        if (!state.conversations.length) {
          el.conversationList.innerHTML =
            '<div class="tiny">No conversations yet.</div>';
          return;
        }

        state.conversations.forEach((conversation) => {
          const otherUsers = conversation.participants
            .map((participant) => participant.user)
            .filter((user) => user.id !== state.user?.id);
          const title =
            conversation.title ||
            otherUsers.map((user) => user.fullName).join(', ') ||
            'Conversation';
          const latest =
            conversation.latestMessage || conversation.messages?.[0];
          const unreadCount = conversation.unreadCount || 0;

          const button = document.createElement('button');
          button.className =
            'item' +
            (conversation.id === state.activeConversationId ? ' active' : '');
          button.innerHTML = `
            <div class="row" style="gap: 6px">
              <span>${escapeHtml(title)}</span>
              ${unreadCount ? `<strong>${unreadCount}</strong>` : ''}
            </div>
            <div class="meta">${escapeHtml(latest?.message || latest?.attachmentType || 'No messages yet')}</div>
          `;
          button.addEventListener('click', () =>
            openConversation(conversation.id),
          );
          el.conversationList.append(button);
        });
      }

      async function openConversation(conversationId) {
        state.activeConversationId = conversationId;
        joinConversationSocket();
        renderConversations();

        const conversation = state.conversations.find(
          (item) => item.id === conversationId,
        );
        const otherUsers =
          conversation?.participants
            ?.map((participant) => participant.user)
            .filter((user) => user.id !== state.user?.id) || [];

        el.chatTitle.textContent =
          conversation?.title ||
          otherUsers.map((user) => user.fullName).join(', ') ||
          'Conversation';
        el.chatMeta.textContent = otherUsers
          .map(
            (user) =>
              `${user.role}${user.preferredLanguage ? ` | ${user.preferredLanguage}` : ''}`,
          )
          .join('    ');

        const messages = await api(
          `/messages/conversations/${conversationId}/messages`,
        );
        renderMessages(messages);
      }

      function renderMessages(messages) {
        el.messages.innerHTML = '';

        if (!messages.length) {
          el.messages.innerHTML = '<div class="empty">No messages yet.</div>';
          return;
        }

        messages.forEach(appendMessage);
        el.messages.scrollTop = el.messages.scrollHeight;
      }

      function appendMessage(message) {
        const existing = document.querySelector(
          `[data-message-id="${message.id}"]`,
        );
        if (existing) return;

        const bubble = document.createElement('div');
        const mine = message.senderId === state.user?.id;
        bubble.className = `bubble${mine ? ' mine' : ''}`;
        bubble.dataset.messageId = message.id;
        bubble.innerHTML = `
          <div class="name">${escapeHtml(message.sender?.fullName || 'User')}</div>
          <div>${escapeHtml(message.message || '')}</div>
          ${message.attachmentUrl ? renderAttachment(message) : ''}
          <div class="time">${new Date(message.createdAt).toLocaleString()}</div>
        `;

        const empty = el.messages.querySelector('.empty');
        if (empty) empty.remove();
        el.messages.append(bubble);
        el.messages.scrollTop = el.messages.scrollHeight;
      }

      async function sendMessage(event) {
        event.preventDefault();
        if (!state.activeConversationId) {
          setStatus('Select a conversation first', true);
          return;
        }

        const text = el.messageInput.value.trim();
        const file = el.fileInput.files?.[0];
        if (!text && !file) return;

        el.sendBtn.disabled = true;
        el.sendBtn.textContent = file ? 'Uploading...' : 'Sending...';

        try {
          if (file) {
            const response = await sendMultipartMessage(
              state.activeConversationId,
              text,
              file,
            );
            appendMessage(response);
          } else if (state.socket?.connected) {
            state.socket.emit('sendMessage', {
              conversationId: state.activeConversationId,
              senderId: state.user.id,
              message: text || undefined,
            });
          } else {
            const response = await api(
              `/messages/conversations/${state.activeConversationId}/messages`,
              {
                method: 'POST',
                body: JSON.stringify({
                  message: text || undefined,
                }),
              },
            );
            appendMessage(response);
          }

          el.messageInput.value = '';
          clearSelectedFile();
        } catch (error) {
          showError(error);
        } finally {
          el.sendBtn.disabled = false;
          el.sendBtn.textContent = 'Send';
        }
      }

      function renderAttachment(message) {
        const url = escapeAttr(message.attachmentUrl);
        const type = message.attachmentType || '';

        if (type.startsWith('image')) {
          return `
            <a href="${url}" target="_blank" rel="noreferrer">
              <img class="attachment-image" src="${url}" alt="Attachment" />
            </a>
          `;
        }

        return `<div><a href="${url}" target="_blank" rel="noreferrer">Open attachment</a></div>`;
      }

      function updateFilePreview() {
        const file = el.fileInput.files?.[0];
        el.filePreview.classList.toggle('visible', Boolean(file));
        el.fileName.textContent = file ? file.name : '';
        el.fileSize.textContent = file ? formatBytes(file.size) : '';

        if (file && file.type.startsWith('image/')) {
          el.fileThumb.style.display = 'block';
          el.fileThumb.src = URL.createObjectURL(file);
        } else {
          el.fileThumb.style.display = 'none';
          el.fileThumb.removeAttribute('src');
        }
      }

      function clearSelectedFile() {
        el.fileInput.value = '';
        updateFilePreview();
      }

      function setSelectedFile(file) {
        const transfer = new DataTransfer();
        transfer.items.add(file);
        el.fileInput.files = transfer.files;
        updateFilePreview();
      }

      function formatBytes(bytes) {
        if (!bytes) return '0 KB';
        const units = ['B', 'KB', 'MB', 'GB'];
        const index = Math.min(
          Math.floor(Math.log(bytes) / Math.log(1024)),
          units.length - 1,
        );
        return `${(bytes / 1024 ** index).toFixed(index ? 1 : 0)} ${units[index]}`;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replaceAll('`', '&#096;');
      }

      el.loginBtn.addEventListener('click', () => login().catch(showError));
      el.logoutBtn.addEventListener('click', clearLogin);
      el.loadContactsBtn.addEventListener('click', () =>
        loadContacts().catch(showError),
      );
      el.createConversationBtn.addEventListener('click', () =>
        createConversation().catch(showError),
      );
      el.loadConversationsBtn.addEventListener('click', () =>
        loadConversations().catch(showError),
      );
      el.composer.addEventListener('submit', sendMessage);
      el.fileInput.addEventListener('change', updateFilePreview);
      el.clearFileBtn.addEventListener('click', clearSelectedFile);
      el.composer.addEventListener('dragover', (event) => {
        event.preventDefault();
        el.composer.classList.add('dragging');
      });
      el.composer.addEventListener('dragleave', () => {
        el.composer.classList.remove('dragging');
      });
      el.composer.addEventListener('drop', (event) => {
        event.preventDefault();
        el.composer.classList.remove('dragging');
        const file = event.dataTransfer.files?.[0];
        if (file) setSelectedFile(file);
      });

      function showError(error) {
        console.error(error);
        setStatus(error.message || 'Something went wrong', true);
      }

      if (state.user && state.token) {
        setStatus(`Token loaded for ${state.user.fullName}`);
        connectSocket();
        Promise.all([loadContacts(), loadConversations()]).catch(showError);
      }
    </script>
  </body>
</html>
