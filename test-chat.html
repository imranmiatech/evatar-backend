<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Chat Test</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
    input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    #chat-box { height: 300px; border: 1px solid #eee; overflow-y: scroll; padding: 10px; background: #f9f9f9; }
    .msg { padding: 8px; margin-bottom: 10px; border-radius: 5px; background: #e0f7fa; }
    .status { font-weight: bold; color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <h2>Support Chat Test (WebSocket)</h2>
  
  <div class="box">
    <h3>1. Connect to Ticket Room</h3>
    <input type="text" id="ticketId" placeholder="Enter Ticket ID" />
    <input type="text" id="userId" placeholder="Enter Your User ID" />
    <button onclick="joinTicket()">Join Ticket Room</button>
    <p id="conn-status">Status: Disconnected</p>
  </div>

  <div class="box">
    <h3>2. Chat</h3>
    <div id="chat-box"></div>
    <input type="text" id="messageInput" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send Message</button>
  </div>

  <script>
    const socket = io('http://localhost:5000/support'); // Ensure your backend is running on port 5000
    
    socket.on('connect', () => {
      document.getElementById('conn-status').innerText = 'Status: Connected to Server (Not in room yet)';
    });

    socket.on('receiveMessage', (data) => {
      console.log('New message received:', data);
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<strong>${data.sender?.fullName || data.senderId}:</strong> ${data.message}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    function joinTicket() {
      const ticketId = document.getElementById('ticketId').value;
      const userId = document.getElementById('userId').value;
      
      if (!ticketId || !userId) return alert('Please enter both Ticket ID and User ID');

      socket.emit('joinTicket', { ticketId, userId }, (response) => {
        console.log('Join response:', response);
        if (response.event === 'joined') {
          document.getElementById('conn-status').innerText = `Status: Joined Room ${ticketId}`;
          document.getElementById('conn-status').className = 'status';
        } else {
          document.getElementById('conn-status').innerText = `Error: ${response.data.message}`;
          document.getElementById('conn-status').className = 'error';
        }
      });
    }

    function sendMessage() {
      const ticketId = document.getElementById('ticketId').value;
      const senderId = document.getElementById('userId').value;
      const message = document.getElementById('messageInput').value;

      if (!ticketId || !senderId || !message) return alert('Please enter Ticket ID, User ID, and a message');

      socket.emit('sendMessage', { ticketId, senderId, message }, (response) => {
        console.log('Send message response:', response);
        if (response.event === 'error') {
          alert('Error: ' + response.data.message);
        } else {
          document.getElementById('messageInput').value = ''; // clear input
        }
      });
    }
  </script>
</body>
</html>
